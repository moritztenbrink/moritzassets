.rv-ctl .fr{margin-left:auto;font:700 1rem/1 var(--f-display);letter-spacing:.08em;color:var(--text-2);text-transform:uppercase;font-variant-numeric:tabular-nums}
.rv-ctl .lab{font:700 .9375rem/1 var(--f-display);letter-spacing:.1em;color:var(--text-3);text-transform:uppercase}
.rv-keys{padding-left:calc(124px - .5rem)}   /* frei für die Prototyp-Taste unten links */

/* Komponenten-Seite */
.comp{max-width:120rem;margin:0 auto;padding:1.75rem var(--gut) 4rem}
.comp h1{margin:0 0 .25rem;font:800 3rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.comp>p{margin:0 0 1.5rem;color:var(--text-2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34rem,1fr));gap:1.25rem}
.cbox{display:grid;gap:1rem;align-content:start}
.cbox .demo{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.cbox .lab{font:600 .8125rem/1 var(--f-display);letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;text-align:center;margin-top:.4rem}
.cbox .cell{display:grid;justify-items:center}
.cbox .medal{width:3.5rem;height:3.5rem}
.stategrid{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:.75rem 1rem;align-items:center}
.stategrid .h{font:700 .8125rem/1 var(--f-display);letter-spacing:.1em;color:var(--text-3);text-transform:uppercase;text-align:center}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.5rem,1fr));gap:.75rem}
.icons .cell span{font-size:.75rem;color:var(--text-3);margin-top:.3rem;text-align:center;line-height:1.1}
.chatwin{display:grid;grid-template-rows:1fr auto;height:15rem;padding:1rem}
.chatwin .msgs{display:grid;gap:.25rem;align-content:end;font-size:.9375rem;color:var(--text-2)}
.chatwin .msgs b{color:var(--text)}

/* ---------- TEAM (Staff-Seite, NEU): Kopf mit Suche und Schnell-Schaltern, Kategorie-Liste mit Rechten ---------- */
.sheet.team{width:min(118rem,100%);height:min(66rem,100%)}
.sheet-wrap.tw{padding:calc(1.25rem + var(--band-h)) 2rem 1.25rem}
.sheet.team>header{position:relative;gap:1rem;padding:.95rem 1.25rem .9rem 1.5rem}
.sheet.team>header::after{content:"";position:absolute;left:0;right:0;bottom:-.125rem;height:.1875rem;background:linear-gradient(90deg,transparent,var(--staff-hi) 10%,var(--staff) 45%,var(--staff-lo) 85%,transparent);box-shadow:0 .25rem 1rem rgba(194,40,28,.35);pointer-events:none}
.sheet.team>header .role{width:3rem;height:3rem;border-image-width:.85rem}
.sheet.team>header .role .ic{width:1.6rem;height:1.6rem}
.sheet.team>header>.ibtn{margin-left:0}
.sheet.team.nonav>header>.ibtn{margin-left:auto}
.thd{display:grid;gap:.25rem;min-width:0}
.thd h2{display:flex;align-items:center;gap:.6rem}
.thd p b{color:var(--text);font-weight:600}
.tsearch{position:relative;flex:1 1 22rem;max-width:36rem;margin-left:auto}
.tsearch .field{min-height:2.625rem}
.tsearch .key{flex:none;opacity:.7}
.tsres{position:absolute;left:0;right:0;top:calc(100% + .4rem);z-index:8;max-height:30rem;overflow:auto;padding:.5rem;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;animation:popIn var(--d3) var(--e-back) both;transform-origin:50% 0;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
.tsres .grp{padding:.55rem .6rem .3rem;font:700 .75rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.tsres button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.5rem .6rem;text-align:left;border-radius:.2rem;transition:background var(--d2),transform var(--d2) var(--e-back)}
.tsres button>.ic{width:1.25rem;height:1.25rem;color:var(--text-gold)}
.tsres button>.ic:last-child{width:1rem;height:1rem;color:var(--text-3)}
.tsres button b{display:block;font:700 1.0625rem/1.15 var(--f-display);letter-spacing:.03em}
.tsres button small{display:block;color:var(--text-3);font-size:.875rem}
.tsres button:hover,.tsres button.on{background:rgba(255,190,60,.1);transform:translateX(.2rem)}
.tsres .none{padding:.75rem;color:var(--text-3);font-size:.9375rem}
.qtg{display:flex;gap:.4rem;flex:none}
.qt{display:inline-flex;align-items:center;gap:.45rem;height:2.375rem;padding:0 .55rem 0 .6rem;border-image:var(--i-chip) 7 fill / .4375rem / 0 stretch;font:700 .9375rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;transition:color var(--d2)}
.qt .ic{width:1.1rem;height:1.1rem}
.qt i{position:relative;width:2rem;height:1.125rem;border-radius:.6rem;background:#0A0806;box-shadow:inset 0 0 0 .0625rem var(--frame-dim);transition:background var(--d3)}
.qt i::after{content:"";position:absolute;left:.15rem;top:.15rem;width:.825rem;height:.825rem;border-radius:50%;background:linear-gradient(#FFE07A,#E8920A);transition:transform var(--d4) var(--e-spring)}
@media (hover:hover){.qt:hover{color:var(--text);border-image-source:var(--i-chip-h)}}
.qt[aria-checked=true]{color:var(--text-gold)}
.qt[aria-checked=true] i{background:var(--on-hi)}
.qt[aria-checked=true] i::after{transform:translateX(.875rem)}
.sheet.team .sbody{grid-template-columns:18.5rem minmax(0,1fr)}
.sheet.team.nonav .sbody{grid-template-columns:minmax(0,1fr)}
.sheet.team.nonav{width:min(46rem,100%);height:auto}
.sheet.team.nonav .noacc{padding:2.5rem 1.5rem 2rem}
.sheet.team .sbody>.main{position:relative}
#tmain.in{animation:pageIn var(--d3) var(--e-out) both}
.tnav{gap:.12rem!important}
.tnav .tcat{display:flex;align-items:center;gap:.5rem;margin:.6rem .5rem .2rem .9rem;font:700 .6875rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.tnav .tcat:first-child{margin-top:.15rem}
.tnav .tcat::after{content:"";flex:1;height:.0625rem;background:var(--frame-faint)}
.sheet.team .sbody>nav.tnav{padding:.75rem .6rem .75rem}
.sheet.team .tnav button{height:2rem;font-size:.9375rem;letter-spacing:.05em;padding:0 .55rem;gap:.5rem}
.tnav button{min-width:0}
.tnav button .ellip{flex:1 1 0;min-width:0;line-height:1.4}   /* Zeilenhöhe: Umlaut-Punkte (Ü, Ä) nicht abschneiden */
.tnav button :is(.ro,.cnt){flex:none}
.tnav button .ro{margin-left:auto;font:700 .5625rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--info);border:.0625rem solid rgba(79,163,227,.45);padding:.14rem .25rem;border-radius:.15rem}
.noacc{min-height:100%;align-content:center}
.noacc h3{margin:0;font-size:2rem}
.noacc p{margin:0;max-width:40ch}
/* Seiten-Kopf, Hinweise, Kennzahlen */
.tph{display:flex;align-items:flex-end;gap:1rem 1.5rem;margin:0 0 1.1rem;flex-wrap:wrap}
.tph h3{margin:0;display:flex;align-items:center;gap:.6rem;font:800 1.875rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tph p{margin:.4rem 0 0;color:var(--text-2);font-size:1rem;max-width:76ch}
.tph .acts{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.note b{color:var(--text)}
.note.ro{background:rgba(79,163,227,.08)}
.note.lock{background:rgba(217,50,51,.08);border-color:var(--staff-hi)}
.note.lock .ic{color:#FF8A78}
.req{display:inline-block;margin-left:.35rem;padding:.1rem .3rem;font-size:.625rem;letter-spacing:.1em;color:#FFB3A6;border:.0625rem solid rgba(224,80,63,.55);border-radius:.15rem;vertical-align:.1rem}
.field.need,.field.need:focus-within,.numf.need input{border-image-source:var(--i-field-red);filter:drop-shadow(0 0 .3rem rgba(224,80,63,.45))}
.field :is(input,textarea):focus-visible,.numf input:focus-visible{outline:none}
.ipick .lifechips{display:grid;grid-template-columns:1fr 1fr}
.field input[type=date],.field input[type=time]{color-scheme:dark;font-variant-numeric:tabular-nums}
.field.grow{min-width:0}
.dtf{gap:.4rem;padding:.25rem .6rem}
.dtf input{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.field.bad{border-image-source:var(--i-field-red)}
.field input::-webkit-calendar-picker-indicator{filter:invert(70%) sepia(70%) saturate(600%) hue-rotate(-12deg);opacity:.8;cursor:pointer}
.field input:disabled,.field textarea:disabled{color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:.75rem;margin-bottom:1rem}
.kpi{display:grid;gap:.3rem;padding:.8rem 1rem;border-image:var(--i-row) 8 fill / .5rem / 0 stretch}
.kpi span{font:700 .75rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.kpi b{font:800 1.75rem/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kpi small{font-size:.875rem;color:var(--text-2)}
.kpi small.up{color:var(--good)} .kpi small.dn{color:#FF8A78}
.tag.purple{background:linear-gradient(#C49AF2,#6A35A8);color:#fff}
/* Tabellen: kompakt, sortierbar, Auswahl */
.tbl.cmp{font-size:.9375rem;border-spacing:0 .25rem}
.tbl.cmp td{padding:.5rem .7rem}
.tbl.cmp th{padding:.2rem .7rem}
.tbl td.wrap{white-space:normal;min-width:12rem;max-width:30rem}
.tbl th[data-act]{cursor:pointer;user-select:none;transition:color var(--d2)}
.tbl th[data-act]:hover{color:var(--text)}
.tbl th .sa{width:.75rem;height:.75rem;margin-left:.3rem;vertical-align:-.05rem;opacity:.3;transition:transform var(--d3) var(--e-back),opacity var(--d2)}
.tbl th[aria-sort] .sa{opacity:1;color:var(--text-gold)}
.tbl th[aria-sort=ascending] .sa{transform:rotate(180deg)}
.tbl tr.sel td{background:rgba(255,190,60,.1);border-color:rgba(255,190,60,.45)}
.tbl tr.undone td{opacity:.5}
.tbl .cur-i{width:1.35em;height:1.35em}
.tbl .avatar{width:1.9rem;height:1.9rem}
.amt{font-weight:600;font-variant-numeric:tabular-nums}
.amt.up{color:var(--good)} .amt.dn{color:#FF8A78}
.diffc{display:inline-flex;gap:.35rem;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.diffc .o{color:var(--diff-old);text-decoration:line-through;text-decoration-color:rgba(255,138,120,.5)} .diffc .n{color:var(--diff-new)}
.diffc .ic{width:.9rem;height:.9rem;color:var(--text-3)}
/* Zahlenfeld mit −/+ */
.numf{display:inline-flex;align-items:center;gap:.3rem;flex:none}
.numf input{width:8.5rem;height:2.5rem;padding:0 .5rem;text-align:center;border:0 solid transparent;border-image:var(--i-field) 7 fill / .4375rem / 0 stretch;background:none;font:700 1.25rem/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--text);outline:none}
.numf input:focus{border-image-source:var(--i-field-f)}
.numf input:disabled{color:var(--text-3)}
.numf.sm input{width:4.5rem;height:2.125rem;font-size:1.0625rem}
/* Bestätigung mit Diff (alt → neu) */
.cw-who{display:flex;align-items:center;gap:.75rem;padding:.25rem 0 .9rem;margin-bottom:.9rem;border-bottom:.0625rem solid var(--frame-faint)}
.cw-who>div{display:grid;gap:.2rem;flex:1 1 auto;min-width:0}
.cw-who b{font:700 1.25rem/1 var(--f-display);letter-spacing:.03em}
.cw-who span{font-size:.875rem;color:var(--text-3)}
.cw-who>.ic{width:2.25rem;height:2.25rem;color:var(--text-gold)}
.diff{display:grid;grid-template-columns:minmax(7rem,max-content) minmax(0,max-content) 1.25rem minmax(0,1fr);gap:.3rem 0;margin:0 0 1rem}
.dr{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;column-gap:.75rem;padding:.5rem .75rem;border-image:var(--i-row) 8 fill / .5rem / 0 stretch;font-size:1rem;font-variant-numeric:tabular-nums}
.dr .dl{font:700 .8125rem/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.dr .do,.dr .dn{justify-self:start;padding:.2rem .5rem;border-radius:.15rem;overflow-wrap:anywhere}
.dr .do{color:var(--diff-old);background:var(--diff-old-bg);text-decoration:line-through;text-decoration-color:rgba(255,138,120,.5)}
.dr .dn{color:var(--diff-new);background:var(--diff-new-bg);font-weight:600}
.dr .ic{width:1.1rem;height:1.1rem;color:var(--text-3)}
.dlg.cw .field textarea{min-height:3.25rem}
.dlg.cw .note{margin:0 0 1rem}
.cwq{margin:.5rem 0 .75rem}
.cwq .chip{height:1.875rem;font-size:.875rem;padding:0 .65rem}
.cwlog{display:flex;align-items:center;gap:.4rem;margin:.5rem 0 0!important;font-size:.875rem;color:var(--text-3)!important}
.cwlog .ic{width:1rem;height:1rem}
.cwfin{display:grid;justify-items:center;gap:.5rem;text-align:center;padding:.5rem 0 .25rem}
.cwfin b{font:800 3.25rem/1 var(--f-display);letter-spacing:.02em;color:var(--text-gold);font-variant-numeric:tabular-nums}
/* Konto-Akte */
.akback{margin:0 0 .75rem}
.akhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.25rem;padding:1rem 1.25rem 1.1rem}
.akhead>.avatar{width:4.75rem;height:4.75rem;clip-path:polygon(.7rem 0,calc(100% - .7rem) 0,100% .7rem,100% calc(100% - .7rem),calc(100% - .7rem) 100%,.7rem 100%,0 calc(100% - .7rem),0 .7rem)}
.akname{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.akname b{font:800 2.125rem/1 var(--f-display);letter-spacing:.03em;margin-right:.2rem}
.akmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem 1.1rem;margin-top:.55rem;font-size:.9375rem;color:var(--text-2)}
.akmeta .num{color:var(--text);font-weight:600}
.aksan{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.55rem}
.akacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.akacts .btn{justify-content:flex-start}
.atabs{position:sticky;top:var(--stk,-1.25rem);z-index:4;margin:.75rem 0 1rem;padding-top:.6rem;background:linear-gradient(#0D0C0B 80%,rgba(13,12,11,0));overflow-x:auto;scrollbar-width:none}
.atabs::-webkit-scrollbar{display:none}
.atabs::before{content:"";position:absolute;left:0;right:0;bottom:0;height:.0625rem;background:var(--frame-faint)}
.atabs .stab{height:2.75rem;font-size:1.0625rem;padding:0 .8rem}
.atabs .stab small{font:600 .8125rem/1 var(--f-display)}
.akdlg{--stk:0rem}
.akdlg .atabs{background:linear-gradient(#0E0C0A 80%,rgba(14,12,10,0))}
.dlg.akdlg{width:min(86rem,100%);height:min(60rem,calc(100% - 1rem))}   /* feste Fenstergröße: Reiterwechsel lässt das Fenster nicht springen */
.akdlg .atabs .stab{padding:0 .6rem;font-size:1rem}
.akbody.in{animation:pageIn var(--d3) var(--e-out) both}
.aksearch{max-width:36rem;margin-bottom:.5rem}
.curcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}
.curcard{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.25rem .9rem;padding:.9rem 1.1rem;text-align:left;border-image:var(--i-card) 18 fill / 1.125rem / 0 stretch;transition:transform var(--d3) var(--e-back)}
.curcard .cur-i{grid-row:1/3;width:3.25rem;height:3.25rem;filter:drop-shadow(0 .15rem .2rem rgba(0,0,0,.6))}
.curcard span{font:700 .8125rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.curcard b{display:inline-block;font:800 2rem/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;transform-origin:0 50%}
.curcard em{position:absolute;top:.75rem;right:.9rem;font:700 .9375rem/1 var(--f-display);font-style:normal;font-variant-numeric:tabular-nums;opacity:0;transform:translateY(.25rem);transition:opacity var(--d2),transform var(--d3) var(--e-back)}
.curcard em.on{opacity:1;transform:none}
.curcard em.up{color:var(--good)} .curcard em.dn{color:#FF8A78}
@media (hover:hover){.curcard:hover{border-image-source:var(--i-card-h);transform:translateY(-.15rem)}}
.curcard.sel{border-image-source:var(--i-card-s)}
.curcard.hit b{animation:curHit .6s var(--e-spring)}
.cured{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1.25rem;align-items:stretch}
.prevbox{display:grid;align-content:center;justify-items:center;gap:.65rem;padding:1rem;text-align:center;border-image:var(--i-row) 8 fill / .5rem / 0 stretch}
.prevbox .pv{display:flex;align-items:center;gap:.6rem;font-variant-numeric:tabular-nums}
.prevbox .pv .cur-i{width:2.25rem;height:2.25rem}
.prevbox .pv>.ic{width:1.25rem;height:1.25rem;color:var(--text-3)}
.prevbox .ao{font:700 1.5rem/1 var(--f-display);color:var(--text-3)}
.prevbox .an{font:800 2.375rem/1 var(--f-display);color:var(--text)}
.delta{font:700 1.0625rem/1 var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.dn{color:#FF8A78} .delta.eq{color:var(--text-3)}
.tile .life{display:inline-flex;align-items:center;gap:.25rem;font:600 .8125rem/1 var(--f-display);letter-spacing:.04em;color:var(--text-2)}
.tile .life .ic{width:.9rem;height:.9rem;color:var(--text-3)}
.anote{display:grid;gap:.35rem;padding:.65rem .8rem;border-image:var(--i-row) 8 fill / .5rem / 0 stretch;font-size:.9375rem}
.anote .row{gap:.45rem;font-size:.875rem;color:var(--text-3)}
.anote .row b{color:var(--text);font-weight:600}
.tline2{display:grid}
.tline2 .ti{display:grid;grid-template-columns:5.75rem 1.25rem minmax(0,1fr);gap:.6rem;align-items:center;padding:.45rem 0;border-bottom:.0625rem dashed var(--frame-faint);font-size:.9375rem}
.tline2 .ti:last-child{border:0}
.tline2 .ti .ic{width:1.1rem;height:1.1rem;color:var(--text-gold)}
.sanc{display:grid;gap:.35rem;padding:.75rem .9rem;margin-bottom:.5rem;border-image:var(--i-row-red) 8 fill / .5rem / 0 stretch}
.sanc b.disp{font-size:1.125rem}
.mailprev{display:grid;gap:.5rem;padding:1rem 1.1rem;border-image:var(--i-card) 18 fill / 1.125rem / 0 stretch;font-size:.9375rem}
.mailprev .from{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--text-3)}
.mailprev .from b{color:var(--text-gold)}
.mailprev h4{margin:0;font:700 1.25rem/1.15 var(--f-display);letter-spacing:.03em}
.mailprev p{margin:0;color:var(--text-2);white-space:pre-line}
.mailprev .gift{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;background:rgba(255,190,60,.08);border-left:.1875rem solid var(--gold-1)}
.mailprev .gift .wbox{width:2.5rem;height:2rem}
.ipick{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.25rem}
.ipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem;max-height:25rem;overflow:auto;padding:.25rem;align-content:start;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
.ipgrid .tile{padding:.6rem .5rem .55rem;gap:.25rem}
.ipgrid .tile .art{width:4.25rem;height:3.25rem}
.ipgrid .tile .nm{font-size:.9375rem}
.ipgrid .tile .ty{font-size:.8125rem}
.starpick{display:inline-flex;gap:.15rem}
.starpick button{color:#5B4A2C;transition:transform var(--d2) var(--e-spring),color var(--d2)}
.starpick button.on{color:#FFC93A;filter:drop-shadow(0 0 .2rem rgba(255,190,60,.6))}
.starpick button:hover{transform:scale(1.15)}
.starpick .ic{width:1.6rem;height:1.6rem}
/* Chat-Live */
.chatfeed{display:grid;gap:.25rem}
.cl{display:grid;grid-template-columns:4.75rem 12.25rem 9rem minmax(0,1fr) auto;align-items:center;gap:.75rem;min-height:2.75rem;padding:.3rem .5rem .3rem .75rem;border-image:var(--i-row) 8 fill / .5rem / 0 stretch;font-size:.9375rem}
.cl.new{animation:stgIn var(--d4) var(--e-out) both}
.cl .t{color:var(--text-3);font:600 .875rem/1 var(--f-display);letter-spacing:.04em}
.cl .tag{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cl .cn{font-weight:600;text-align:left;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .cn:hover{color:var(--text-gold);text-decoration:underline}
.cl .cm{min-width:0;color:var(--text-2);display:flex;align-items:center;gap:.5rem}
.cl .cm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl.flag{border-image-source:var(--i-row-red)}
.cl.flag .cm{color:var(--text)}

.matrix td.grp{background:none!important;border:0!important;padding:.9rem .25rem .25rem!important;font:700 .75rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-gold)}

.mx{display:inline-grid;place-items:center;min-width:2rem;height:1.5rem;padding:0 .4rem;font:700 .75rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border-radius:.15rem}

.frq{display:grid;gap:.65rem;padding:1rem 1.25rem;margin-bottom:.75rem}
.frq .frqh{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.9375rem;color:var(--text-2)}
.frq h4{margin:0;font:800 1.625rem/1 var(--f-display);letter-spacing:.03em}
.frq .why{color:var(--text-2);font-size:.9375rem}
.frq .diff{margin:0}
.frq.done{opacity:.7}
/* Diagramm (Quellen vs. Senken) */
.chart{position:relative;margin-top:.5rem}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--ch-grid);stroke-width:1;shape-rendering:crispEdges}
.chart .zl{stroke:var(--ch-axis);stroke-width:1;shape-rendering:crispEdges}
.chart text{fill:var(--text-3);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em}
.chart text.dl{fill:var(--text);font-size:16px;font-weight:700}
.chart text.ev{fill:var(--text-gold);font-size:13px;letter-spacing:.1em}
.chart .src{fill:var(--ch-src)} .chart .snk{fill:var(--ch-snk)}
.chart .net{fill:none;stroke:var(--ch-net);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .halo{fill:none;stroke:var(--panel);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.chart .dot{fill:var(--ch-net);stroke:var(--panel);stroke-width:2}
.chart .evt{fill:rgba(255,190,60,.05)}

.chart .hit.on{fill:rgba(255,230,170,.06)}
.ctip{position:absolute;z-index:3;min-width:13rem;padding:.6rem .8rem;border-image:var(--i-panel) 18 fill / .875rem / 0 stretch;pointer-events:none;transform:translateX(.6rem);font-size:.9375rem;opacity:0;transition:opacity var(--d2)}

.ctip.on{opacity:1}

.ctip .r{display:flex;align-items:center;gap:.5rem;padding:.12rem 0;color:var(--text-2)}
.ctip .r span{margin-left:auto;padding-left:1rem;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.lgd{display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;font:600 .9375rem/1 var(--f-display);letter-spacing:.04em;color:var(--text-2)}
.lgd span{display:inline-flex;align-items:center;gap:.45rem}
.sw-src,.sw-snk{display:inline-block;width:.8rem;height:.8rem;border-radius:.15rem}

.split3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.brk{display:grid;gap:.55rem}
.brk .r{display:grid;grid-template-columns:11rem minmax(0,1fr) 3rem;align-items:center;gap:.75rem;font-size:.9375rem}

.bar.src{--fill:linear-gradient(#E8A33A,var(--ch-src))} .bar.snk{--fill:linear-gradient(#6FA8E0,var(--ch-snk))}
.bar.src>.in>i::after,.bar.snk>.in>i::after{display:none}
.reach{display:grid;justify-items:center;gap:.2rem;padding:.75rem 0 1rem}
.reach b{font:800 3.25rem/1 var(--f-display);letter-spacing:.02em;color:var(--text-gold);font-variant-numeric:tabular-nums}
.reach span{font:700 .875rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
/* Wartungsband (Systemband über allen Menüs) */
:root{--band-h:0rem}

<!-- ===== Prototyp-Steuerung (nicht Teil des Spiels) ===== -->
<div id="proto"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Brixel UI-Prototyp – Kern: Hilfen, Skalierung, 9-Slice-Platten aus den
   Tokens, Bilder (Inline-SVG), gezeichnete Welt, Partikel-Engine, Dialoge.
   ===================================================================== */

/* ---------- Hilfen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('de-DE');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('brixel-proto:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('brixel-proto:' + k, JSON.stringify(v)); } catch (e) { /* Speicher gesperrt */ } }
};
const tok = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
function seeded(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const later = (ms, f) => setTimeout(f, ms);

/* ---------- Skalierung (UI_KONZEPT 10.1): f_auto = clamp(√((W/1920)·(H/1080)), 0.6, 2.0), f = f_auto · UI-Größe;
   Sicherheitsnetz: wäre die logische Breite < 1280, gilt f = min(W/1920, H/1080) · UI-Größe. Nur Desktop. ---------- */
const SCALE = { f: 1, px: 16, lw: 1920, lh: 1080 };
function applyScale() {
  const w = window.innerWidth, h = window.innerHeight, g = S.uiSize || 1;
  let f = clamp(Math.sqrt((w / 1920) * (h / 1080)), 0.6, 2.0) * g;
  if (w / f < 1280) f = Math.min(w / 1920, h / 1080) * g;
  const px = Math.round(16 * f * 1000) / 1000;
  document.documentElement.style.fontSize = px + 'px';
  SCALE.f = f; SCALE.px = px; SCALE.lw = w / f; SCALE.lh = h / f;
  const el = document.documentElement;
  el.dataset.lay = SCALE.lw < 1440 ? 'narrow' : (SCALE.lw < 1760 || SCALE.lh < 900) ? 'mid' : 'wide';
  el.classList.toggle('ultra', w / h > 2.1);
  el.classList.toggle('roomy', SCALE.lw >= 2000);

const rem = n => n * SCALE.px;

/* ---------- 9-Slice-Platten: SVG aus den Tokens erzeugen ---------- */
function oct(x1, y1, x2, y2, c, top = true, bot = true) {
  const t = top ? c : 0, b = bot ? c : 0;
  return `M${x1 + t} ${y1}H${x2 - t}L${x2} ${y1 + t}V${y2 - b}L${x2 - b} ${y2}H${x1 + b}L${x1} ${y2 - b}V${y1 + t}Z`;

const svgUrl = s => `url("data:image/svg+xml,${encodeURIComponent(s.replace(/\s+/g, ' '))}")`;
const svgDoc = (S, body, defs = '') => `<svg xmlns='http://www.w3.org/2000/svg' width='${S}' height='${S}' viewBox='0 0 ${S} ${S}'><defs>${defs}</defs>${body}</svg>`;
const grad = (id, stops, x2 = 0, y2 = 1) => `<linearGradient id='${id}' x1='0' y1='0' x2='${x2}' y2='${y2}'>${stops.map(([o, c, a]) => `<stop offset='${o}' stop-color='${c}'${a != null ? ` stop-opacity='${a}'` : ''}/>`).join('')}</linearGradient>`;

/* Platte (Sheet: Kontur, Oberlicht, Körper-Verlauf, Innenlinie, Unterkante als 3D-Lippe) */
function plate(o) {
  const S = o.S || 48, c = o.c || 7, lip = o.lipH ?? 5, rw = o.ringW ?? 4, t = o.top !== false, b = o.bot !== false;
  const ix1 = 2 + rw, iy1 = 2 + rw, ix2 = S - 2 - rw, iy2 = S - 2 - lip - rw * 0.8, ic = Math.max(1.5, c - rw * 0.55);
  const defs = grad('r', [[0, o.hi], [0.08, o.r1], [1, o.r2]]) + grad('b', [[0, o.b1], [1, o.b2]]);
  let body = `<path d='${oct(0, 0, S, S, c, t, b)}' fill='${o.outline}'/>`
    + `<path d='${oct(2, 2, S - 2, S - 2, c - 1, t, b)}' fill='${o.lip}'/>`
    + `<path d='${oct(2, 2, S - 2, S - 2 - lip, c - 1, t, b)}' fill='url(#r)'/>`
    + `<path d='${oct(ix1, iy1, ix2, iy2, ic, t, b)}' fill='url(#b)' stroke='${o.inset}' stroke-width='1.1'/>`;
  if (o.engrave !== false) body += `<path d='${oct(ix1 + 1.1, iy1 + 1.1, ix2 - 1.1, iy2 - 1.1, Math.max(1, ic - 0.6), t, b)}' fill='none' stroke='${o.hi}' stroke-opacity='.32' stroke-width='.9'/>`;
  return svgDoc(S, body, defs);

/* Panel (dunkel, dünner goldener Doppelrahmen, abgeschrägt) */
function panelImg(o) {
  const S = o.S || 48, c = o.c || 9;

    + `<path d='${oct(1, 1, S - 1, S - 1, c - 0.4)}' fill='url(#f)'/>`
    + `<path d='${oct(1 + (o.lw || 1.6), 1 + (o.lw || 1.6), S - 1 - (o.lw || 1.6), S - 1 - (o.lw || 1.6), c - 1)}' fill='url(#p)'/>`;

  return svgDoc(S, body, defs);

function ornateImg() {
  const S = 52, g = tok;
  const defs = grad('f', [[0, g('frame-hi')], [1, g('frame')]]) + grad('k', [[0, g('gold-hi')], [0.15, g('gold-ring-1')], [1, g('gold-2')]]) + grad('p', [[0, '#141110'], [1, g('panel')]]);

  const bracket = tr => `<g transform='${tr}'><path d='${L}' fill='${g('gold-outline')}'/><path d='M1.4 3L3 1.4H17.6V5.6H5.6V17.6H1.4Z' fill='url(#k)'/><path d='M3 3.6H15.8M3.6 3V15.8' stroke='${g('gold-inset')}' stroke-width='.9'/></g>`;
  const body = `<rect x='3' y='3' width='${S - 6}' height='${S - 6}' fill='url(#p)'/>`
    + `<rect x='3.5' y='3.5' width='${S - 7}' height='${S - 7}' fill='none' stroke='url(#f)' stroke-width='2'/>`
    + `<rect x='7' y='7' width='${S - 14}' height='${S - 14}' fill='none' stroke='${g('frame')}' stroke-opacity='.4' stroke-width='1'/>`
    + bracket('') + bracket(`translate(${S} 0) scale(-1 1)`) + bracket(`translate(0 ${S}) scale(1 -1)`) + bracket(`translate(${S} ${S}) scale(-1 -1)`);

/* ---------- Zahlen rollen ---------- */
function roll(el, from, to, dur = 900, suffix = '') {
  if (!el) return; if (S.reduced) { el.textContent = fmt(to) + suffix; return; }
  const t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e) + suffix; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function setWallet(k, to, o = {}) {
  const from = S.wallet[k]; S.wallet[k] = to;
  $$(`[data-cur="${k}"] .v`).forEach(el => { roll(el, from, to, o.dur || 900); const p = el.closest('.cur'); if (p) { p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit'); } });
}

  b.classList.toggle('blur-hard', ['waiting', 'sequence', 'results', 'components'].includes(S.base));
  b.classList.toggle('set-open', S.set.open);

}
function setBase(b) {

  S.base = b; rvKills = -1;
  const sc = $('#screen'), sys = $('#sys');
  sc.hidden = !SCREEN_LAYERS.includes(b); sys.hidden = !['loading', 'error'].includes(b);
  if (sc.hidden) sc.innerHTML = ''; if (sys.hidden) sys.innerHTML = '';
  World.set(b === 'world' ? { P: 'plaza', B: 'build', M: 'match', A: 'asset' }[S.ort] : ['replay', 'waiting', 'results', 'sequence'].includes(b) ? 'match' : 'plaza');

}

  if (o === 'M' && S.social.open) closeSocial();

}
function closeAllOverlays() {
  while (S.dlgs.length) topDlg().close('reset');

function go(id) {

/* Gamepad: Start = Menü, B = Zurück, LB/RB = Reiter, LT/RT = Unterreiter, Y = Sozial */
let padPrev = [];
function padLoop() {

  const pr = i => gp.buttons[i] && gp.buttons[i].pressed && !padPrev[i];
  if (pr(9)) back(); else if (pr(1)) back();
  if (S.hub) { if (pr(4)) tabStep(-1); if (pr(5)) tabStep(1); if (pr(6)) subStep(-1); if (pr(7)) subStep(1); if (pr(3)) S.social.open ? closeSocial() : openSocial(); }
  padPrev = gp.buttons.map(b => b.pressed); requestAnimationFrame(padLoop);
