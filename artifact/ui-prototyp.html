}
/* Panel (dunkel, dünner goldener Doppelrahmen, abgeschrägt) */
function panelImg(o) {
  const S = o.S || 48, c = o.c || 9;
  const defs = grad('f', [[0, o.l1], [0.5, o.l2], [1, o.l3 || o.l2]]) + grad('p', [[0, o.f1], [1, o.f2]]);
  let body = `<path d='${oct(0, 0, S, S, c)}' fill='${o.outline || '#000'}' fill-opacity='${o.oo ?? 0.9}'/>`
    + `<path d='${oct(1, 1, S - 1, S - 1, c - 0.4)}' fill='url(#f)'/>`
    + `<path d='${oct(1 + (o.lw || 1.6), 1 + (o.lw || 1.6), S - 1 - (o.lw || 1.6), S - 1 - (o.lw || 1.6), c - 1)}' fill='url(#p)'/>`;
  if (o.inner) body += `<path d='${oct(5, 5, S - 5, S - 5, Math.max(1, c - 2.4))}' fill='none' stroke='${o.inner}' stroke-opacity='${o.io ?? 0.45}' stroke-width='1'/>`;
  return svgDoc(S, body, defs);
}
/* Prunkrahmen: Eck-Klammern als Gold-Platten (Ecken bleiben fest im 9-Slice) */
function ornateImg() {
  const S = 52, g = tok;
  const defs = grad('f', [[0, g('frame-hi')], [1, g('frame')]]) + grad('k', [[0, g('gold-hi')], [0.15, g('gold-ring-1')], [1, g('gold-2')]]) + grad('p', [[0, '#141110'], [1, g('panel')]]);
  const L = `M0 2.5L2.5 0H19V7H7V19H0Z`;
  const bracket = tr => `<g transform='${tr}'><path d='${L}' fill='${g('gold-outline')}'/><path d='M1.4 3L3 1.4H17.6V5.6H5.6V17.6H1.4Z' fill='url(#k)'/><path d='M3 3.6H15.8M3.6 3V15.8' stroke='${g('gold-inset')}' stroke-width='.9'/></g>`;
  const body = `<rect x='3' y='3' width='${S - 6}' height='${S - 6}' fill='url(#p)'/>`
    + `<rect x='3.5' y='3.5' width='${S - 7}' height='${S - 7}' fill='none' stroke='url(#f)' stroke-width='2'/>`
    + `<rect x='7' y='7' width='${S - 14}' height='${S - 14}' fill='none' stroke='${g('frame')}' stroke-opacity='.4' stroke-width='1'/>`
    + bracket('') + bracket(`translate(${S} 0) scale(-1 1)`) + bracket(`translate(0 ${S}) scale(1 -1)`) + bracket(`translate(${S} ${S}) scale(-1 -1)`);

}

  const g = tok;

}
function bannerImgs() {

  const plateB = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 52' preserveAspectRatio='none'><defs>${k}</defs><path d='M10 1H190L199 12V40L190 51H10L1 40V12Z' fill='${g('gold-outline')}'/><path d='M11 3H189L196.5 12.5V39.5L189 49H11L3.5 39.5V12.5Z' fill='url(#k)'/><path d='M14 8H186L191 14V38L186 44H14L9 38V14Z' fill='none' stroke='${g('gold-inset')}' stroke-width='1.2'/></svg>`;

  const pennant = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 112 120' preserveAspectRatio='none'><defs>${k}</defs><path d='M6 1H106L111 6V80L56 119L1 80V6Z' fill='${g('gold-outline')}'/><path d='M7 3.5H105L108.5 7V78.5L56 115.5L3.5 78.5V7Z' fill='url(#k)'/><path d='M12 9H100V75L56 106L12 75Z' fill='none' stroke='${g('gold-inset')}' stroke-width='1.3'/></svg>`;

function roll(el, from, to, dur = 900, suffix = '') {
  if (!el) return; if (S.reduced) { el.textContent = fmt(to) + suffix; return; }
  const t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e) + suffix; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

    <label>Tab-Liste<select id="pTL"><option value="auto">Automatisch (Ort + Modus)</option><option value="plaza">Plaza</option><option value="asset">Asset-Karte</option><option value="bau">Bauplatz</option><option value="team">Match: Team-Modus</option><option value="ffa">Match: Jeder gegen jeden</option><option value="def">Match: Verteidigung</option><option value="zombie">Match: Zombie</option></select></label>
    <div><div class="hint">UI-Größe</div>${sg('pSize', [['0.85', 'Klein 85 %'], ['1', 'Mittel 100 %'], ['1.2', 'Groß 120 %']], S.uiSize)}</div>
    <label class="ck"><input type="checkbox" id="pRed" ${S.reduced ? 'checked' : ''}> Animationen reduzieren</label>
    <label class="ck"><input type="checkbox" id="pPad"> Gamepad-Hinweise zeigen</label>
    <div><div class="hint">Partikel-Test</div><div class="sg" id="pFx">${[['sparks', 'Funken'], ['coins', 'Münzen'], ['confetti', 'Konfetti'], ['embers', 'Glut'], ['ring', 'Ring'], ['rays', 'Strahlen'], ['sparkle', 'Glitzer'], ['rare', 'Selten'], ['epic', 'Episch'], ['jackpot', 'Hauptgewinn'], ['crack', 'Riss']].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div><div class="hint">HUD-Test (Match)</div><div class="sg" id="pHud">${[['dmg', 'Schaden nehmen'], ['heal', 'Heilen'], ['armor', 'Rüstung brechen'], ['low', 'Wenig Leben'], ['buff', 'Buff'], ['gren', 'Granate'], ['dead', 'Ausgeschaltet'], ['build', 'Bauphase']].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div><div class="hint">Ereignisse</div><div class="sg" id="pEv">${[['pq', 'Popup-Warteschlange'], ['inv', 'Party-Einladung'], ['follow', 'Folgen-Karte'], ['sup', 'Support-Antwort'], ['stage', 'Bühnen-Banner'], ['toast', 'Toast'], ['bad', 'Ablehnung']].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('')}</div></div>
    <label>Fehlerart<select id="pErr">${ERRS.map((e, i) => `<option value="${i}">${e[0]}${i >= 5 ? ' (' + (i === 5 ? 'Version' : 'Hubs voll') + ')' : ''}</option>`).join('')}</select></label>
    <div class="hint">Tasten: Esc zurück · Q/E Reiter · 1–9 Unterreiter · Y Sozial · Tab halten (Rechtsklick heftet an) · Z Funkrad · P Foto · im Bau-HUD T R F Q X Z Y, Mausrad</div>
  </div>`;
  const tg = $('#pToggle'), pp = $('#pPanel');
  tg.addEventListener('click', () => { const o = pp.hidden; pp.hidden = !o; tg.setAttribute('aria-expanded', o); tg.textContent = (o ? '▾' : '▸') + ' Prototyp'; store.set('protoOpen', o); });
  $('#pScr').addEventListener('change', e => go(e.target.value));
  $('#pOrt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const o = b.dataset.v; closeAllOverlays(); S.ort = o; if (o === 'M') S.hudMode = 'combat'; setBase('world'); if (o === 'P') openHub(); syncProto(); });
  $('#pRole').addEventListener('change', e => { S.role = e.target.value; if (S.hub) { renderHub(); renderSub(); tabBadges(); renderPage(0); requestAnimationFrame(() => moveGlide(true)); } if (S.esc) renderEsc(); if (S.sheet === 'team') { if (!isStaff()) closeSheet(); else renderSheet(); } toast('Rolle: ' + { player: 'Spieler', mod: 'MOD', dev: 'DEV', admin: 'ADMIN' }[S.role] + (isStaff() ? ' – TEAM-Schild oben rechts.' : '')); });
  $('#pMM').addEventListener('change', e => { S.matchMode = e.target.value; if (S.ort === 'M' && S.base === 'world') renderHUD(); else go('hudm'); if (S.tl.show) renderTabList(); });
  $('#pTL').addEventListener('change', e => { S.tlVariant = e.target.value; if (S.base !== 'world') go('tablist'); else tlShow(true); });
  $('#pSize').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setUiSize(+b.dataset.v); });
  $('#pRed').addEventListener('change', e => setReduced(e.target.checked));
  $('#pPad').addEventListener('change', e => document.documentElement.classList.toggle('pad-mode', e.target.checked));
  $('#pFx').addEventListener('click', e => { const b = e.target.closest('button'); if (b) fxTest(b.dataset.v); });
  $('#pHud').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v;
    if (!(S.ort === 'M' && S.base === 'world')) go('hudm');
    if (v === 'build') return A.buildPhase();
    if (S.hudMode === 'build' && ['gren'].includes(v)) { S.hudMode = 'combat'; renderHUD(); }
    ({ dmg: () => takeDamage(22), heal: () => heal(), armor: () => { if (!S.armor) { S.armor = 50; updVitals(true); } armorBreak(); }, low: () => { S.hp = 18; S.armor = 0; updVitals(false); }, buff: () => { const ids = Object.keys(BUFFS); addBuff(ids[(S.buffI = ((S.buffI ?? -1) + 1)) % ids.length]); }, gren: () => grenade(), dead: () => { S.hp = 0; updVitals(false); die(); } }[v])();
  });
  $('#pEv').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v;
    ({ pq: () => { closeAllDialogs(); runPopupQueue(); }, inv: () => partyInviteN(), follow: () => startFollow('Kiesel'), sup: () => notify({ k: 'Support', title: 'Der Support hat auf dein Ticket #4812 geantwortet.', text: 'Öffnen über das Zahnrad oder „?“ im Menü.', icon: 'question', dur: 10, acts: [{ label: 'ÖFFNEN', fn: () => openSupport() }] }), stage: () => notify({ k: 'Event · Bühne', title: 'Herbstlaub beginnt!', text: 'Doppelte Brix bis 22:00. Die Bühne ist offen.', icon: 'star', dur: 10, acts: [{ label: 'SCHLIESSEN', v: 'dark' }] }), toast: () => toast('Foto gespeichert.', 'good', 'camera'), bad: () => toast('Dort ist schon ein Brick.', 'bad') }[v])();
  });
  $('#pErr').addEventListener('change', e => { S.errType = +e.target.value; go('error'); });
  syncProto();
}
function syncProto() {
  const s = $('#pScr'); if (!s) return;
  const cur = S.base !== 'world' ? S.base : S.sheet === 'plot' ? 'plot' : S.sheet === 'team' ? 'team' : S.set.open ? 'settings' : S.tl.show && S.ort === 'M' && S.tl.pinned ? 'scoreboard' : S.tl.show ? 'tablist' : S.hub ? 'hub' : S.esc ? 'esc' : S.ort === 'M' ? 'hudm' : S.ort === 'B' ? 'hudb' : 'esc';
  s.value = cur;
  $$('#pOrt button').forEach(b => b.classList.toggle('on', b.dataset.v === S.ort));
  $$('#pSize button').forEach(b => b.classList.toggle('on', +b.dataset.v === S.uiSize));
  $('#pRole').value = S.role; $('#pMM').value = S.matchMode; $('#pTL').value = S.tlVariant; $('#pRed').checked = S.reduced; $('#pErr').value = S.errType;
  $('#pPad').checked = document.documentElement.classList.contains('pad-mode');
}

/* ---------- Start ---------- */
function init() {
  const tl = $('#tablist'); tl.innerHTML = '<div id="tlhost"></div><div id="radiohost"></div><div id="palhost"></div>';
  const ph = document.createElement('div'); ph.id = 'photo'; ph.className = 'layer'; ph.hidden = true; $('#app').insertBefore(ph, $('#fx'));
  S.uiSize = store.get('ui', 1);
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  S.reduced = store.get('reduced', mq ? mq.matches : false);
  document.documentElement.classList.toggle('reduced', S.reduced);
  applyScale(); buildPlates(); World.init(); FX.init();
  const savedTab = store.get('tab', 'lobby'); if (TABS.some(t => t[0] === savedTab)) S.tab = savedTab;
  renderProto();
  setBase('world'); openHub();
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); applyScale(); FX.resize(); if (S.hub) { moveGlide(true); moveSubGlide(true); } rt = setTimeout(() => { World.draw(); if (S.base === 'replay') rvUpdate(); }, 120); });
  // Match-Uhr und Killfeed
  let clock = 252;
  setInterval(() => {
    if (S.base !== 'world' || S.ort !== 'M') return; clock = clock > 0 ? clock - 1 : 300; const c = $('#clock'); if (c) c.textContent = mmss(clock).padStart(5, '0');
    if (clock % 7 === 0 && S.hudMode === 'combat') { const kf = $('#kf'); if (kf) { const a = pick(MATCHP), b = pick(MATCHP.filter(p => p.team !== a.team)); kf.insertAdjacentHTML('beforeend', kfHTML([a.n, a.team, pick(['gun', 'pistol', 'sword', 'grenade']), b.n, b.team, Math.random() < 0.3, false])); while (kf.children.length > 5) kf.firstChild.remove(); } }
  }, 1000);
}
init();
</script>
