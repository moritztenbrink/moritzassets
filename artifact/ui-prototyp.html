<title>Brixel UI-Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Vollbild-Spiel-UI über einer gezeichneten Welt (Canvas). Ebenen: Welt < HUD < Vollbild-Screens < Hub/Esc-Menü < Panels < Einstellungen < Dialoge < Popups < Partikel < Toasts < System.
   Alle Maße in rem: 1rem = 16px bei 1920×1080; JS setzt die Wurzel-Schriftgröße (Auto-Skalierung × UI-Größe). */
:root{
  color-scheme:dark;
  /* Grund */
  --bg:#00040A; --panel:#0B0B0D; --track:#0B0D0F; --panel-2:#121013; --panel-3:#17130E; --scrim:rgba(0,4,10,.72); --scrim-2:rgba(0,4,10,.5);
  /* Gold-Platte (gemessen) */
  --gold-outline:#3A1400; --gold-hi:#FFD148; --gold-1:#FBB21D; --gold-2:#F9A50E; --gold-inset:#C27200; --gold-lip:#A85200; --gold-ring-1:#FFC531; --gold-ring-2:#EC960B;
  /* Zustände (gemessen: normal / hover / gedrückt / deaktiviert) */
  --st-normal:#FCAE0F; --st-hover:#FFC21F; --st-pressed:#C26D02; --st-disabled:#A76919;
  --gold-h-hi:#FFE27E; --gold-h-1:#FFC93A; --gold-h-2:#FFBC1A; --gold-h-ring-1:#FFD452; --gold-h-ring-2:#F5A514; --gold-h-inset:#CF7E00; --gold-h-lip:#B05C00;
  --gold-p-hi:#D88A12; --gold-p-1:#C87506; --gold-p-2:#BC6A02; --gold-p-ring-1:#CF7E08; --gold-p-ring-2:#B46202; --gold-p-inset:#8C4800; --gold-p-lip:#7A3A00;
  --gold-d-hi:#BE8838; --gold-d-1:#AB6F21; --gold-d-2:#A26616; --gold-d-ring-1:#B07628; --gold-d-ring-2:#985E14; --gold-d-inset:#80500F; --gold-d-lip:#6A4410;
  --glyph:#562C00; --glyph-hl:rgba(255,226,140,.55); --glyph-dis:#70501F;
  /* Panel-Rahmen */
  --frame:#AE5F00; --frame-hi:#D4B55C; --frame-lo:#5E3200; --frame-dim:rgba(174,95,0,.4); --frame-faint:rgba(174,95,0,.22);
  /* Dunkle Platte (Sekundär-Knopf, Reiter aus) */
  --dark-outline:#140A02; --dark-1:#19140E; --dark-2:#0F0C09; --dark-h-1:#261C10; --dark-h-2:#17110A; --dark-p-1:#0C0A07; --dark-p-2:#080605; --dark-lip:#050302; --dark-inset:#3A2810; --dark-d-ring:#4E3C26;
  /* Schalter, Gefahr */
  --on:#192F01; --on-hi:#2F5508;
  --danger:#7C1F17; --danger-1:#952A1E; --danger-hi:#D0563F; --danger-ring-1:#B23A2A; --danger-ring-2:#7E2016; --danger-outline:#250402; --danger-lip:#470B06; --danger-inset:#5A120C;
  --danger-h-1:#A83324; --danger-h-hi:#E46C52; --danger-p-1:#691710; --danger-p-hi:#8E2A1E; --danger-d-1:#5E3A34; --danger-d-hi:#7C4E46;
  /* Text */
  --text:#F3E9D2; --text-2:#C8BB9C; --text-3:#8D826B; --text-gold:#FFC93A; --text-on-red:#FBEBDC;
  /* Akzente aus dem Sheet */
  --heart:#D93233; --potion:#1D7DBD; --gem:#C71E15; --good:#7FC241; --good-2:#4E8A1E; --info:#4FA3E3; --warn:#F2A33A;
  /* Rollen-Badges */
  --r-crown:#9C4D01; --r-crown-hi:#D9820F; --r-admin-1:#AE4033; --r-admin-2:#7C100B; --r-dev-1:#7543A4; --r-dev-2:#3B116A; --r-mod-1:#66842E; --r-mod-2:#1E3A01; --r-player-1:#5C83A8; --r-player-2:#15406C;
  /* Stufen (Gewöhnlich abgeleitet) */
  --t-common:#A3ADB8; --t-uncommon:#63BB40; --t-rare:#3F92EA; --t-epic:#A963EA; --t-jackpot:#FFC21F;
  /* Teams (abgeleitet, fürs HUD aufgehellt) */
  --team-blue:#5AAEFF; --team-red:#FF6150;
  /* Währungen */
  --cur-kristalle:#63D0FF; --cur-splitter:#C08AF5; --cur-brix:#FFC21F;
  /* Welt */
  --sky-1:#03081A; --sky-2:#0A1733; --sky-3:#163059; --win:#FFC86A; --lamp:#FFB54A;
  /* TEAM (Staff), Diff alt → neu, Diagramm (validiert: Quellen/Senken dunkel, CVD-sicher) */
  --staff:#C2281C; --staff-hi:#E0503F; --staff-lo:#7C1F17;
  --diff-old:#FF8A78; --diff-new:#9BE05A; --diff-old-bg:rgba(217,50,51,.12); --diff-new-bg:rgba(99,187,64,.12);
  --ch-src:#C4840F; --ch-snk:#3D86CC; --ch-net:#E9DDBE; --ch-grid:rgba(212,181,92,.12); --ch-axis:rgba(212,181,92,.38);
  /* Fokus */
  --focus:#FFF4CF; --focus-glow:rgba(255,196,64,.9);
  /* Schrift */
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Bewegung: Dauer-Tokens 90/160/240/420/900 ms, outCubic, outBack(1.4), inOutQuad, Feder */
  --d1:90ms; --d2:160ms; --d3:240ms; --d4:420ms; --d5:900ms;
  --e-out:cubic-bezier(.215,.61,.355,1); --e-back:cubic-bezier(.34,1.4,.64,1); --e-io:cubic-bezier(.455,.03,.515,.955); --e-spring:cubic-bezier(.2,1.65,.38,1);
  /* Maße */
  --top-h:4.75rem; --sub-h:3rem; --foot-h:2.75rem; --gut:2rem;
}

/* ---------- Basis ---------- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);height:100%;overflow:hidden}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:1.1875rem;line-height:1.42;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,textarea{outline:none}
[hidden]{display:none!important}
h1,h2,h3,h4{text-wrap:balance}
p{text-wrap:pretty}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:.125rem solid var(--focus);outline-offset:.1875rem}
::selection{background:#7A4A08;color:var(--text)}
.disp{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.gold{color:var(--text-gold)}
.small{font-size:1rem}
.tiny{font-size:.875rem}
.row{display:flex;align-items:center;gap:.75rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.sp{flex:1 1 auto}
.stack{display:grid;gap:1rem}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
.scroll::-webkit-scrollbar{width:.5rem;height:.5rem}
.scroll::-webkit-scrollbar-thumb{background:#5A3608;border-radius:.25rem}
.ic{width:1.5em;height:1.5em;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}

/* ---------- 9-Slice-Platten (Bilder kommen per JS aus den Tokens) ---------- */
.btn,.ibtn,.tab,.chip,.panel,.card,.field,.bar,.tgl,.chk,.lrow,.slot,.role,.plq,.cur,.frame-o,.tile,.seg button{border:0 solid transparent}
.btn,.ibtn,.tab,.chip,.cur .plus{--oct:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}

/* Knopf */
.btn{--c:.4375rem;--bw:1rem;--img:var(--i-gold);--img-h:var(--i-gold-h);--img-p:var(--i-gold-p);--img-d:var(--i-gold-d);
  position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:2.875rem;padding:.2rem 1.4rem .5rem;
  border-image:var(--img) 16 fill / var(--bw) / 0 stretch;color:var(--glyph);font:700 1.3125rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;text-shadow:0 .0625rem 0 var(--glyph-hl);
  white-space:nowrap;user-select:none;cursor:pointer;transform:translateZ(0);transition:transform var(--d3) var(--e-back),filter var(--d2) var(--e-out);will-change:transform}
.btn .ic{width:1.3em;height:1.3em;filter:drop-shadow(0 .0625rem 0 var(--glyph-hl))}
.shn{position:absolute;inset:.125rem .125rem .375rem;clip-path:var(--oct);overflow:hidden;pointer-events:none;z-index:1;mix-blend-mode:overlay}
.shn::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0 36%,rgba(255,255,255,.85) 48%,transparent 60% 100%);transform:translateX(-110%)}
.btn.dark .shn,.ibtn.dark .shn{mix-blend-mode:screen;opacity:.35}
.btn>span:not(.shn):not(.cnt):not(.spin),.btn>.ic{position:relative;z-index:2}
.btn::after{content:"";position:absolute;inset:.1875rem .1875rem .4375rem;clip-path:var(--oct);background:var(--tex) 0 0/11rem 11rem;mix-blend-mode:multiply;opacity:.5;pointer-events:none;z-index:-1}
.btn.lg::after,.ibtn.lg::after{background:radial-gradient(circle at .3rem 34%,rgba(120,60,0,.9) 0 .12rem,rgba(255,230,160,.6) .13rem .17rem,transparent .2rem),radial-gradient(circle at calc(100% - .3rem) 34%,rgba(120,60,0,.9) 0 .12rem,rgba(255,230,160,.6) .13rem .17rem,transparent .2rem),var(--tex) 0 0/11rem 11rem}
@media (hover:hover){
  .btn:hover:not([aria-disabled=true]),.btn.is-hover{border-image-source:var(--img-h);transform:translateY(-.125rem)}
  .btn:hover:not([aria-disabled=true]) .shn::before,.btn.is-hover .shn::before{animation:shine .75s var(--e-out)}
}
.btn:active:not([aria-disabled=true]),.btn.is-press,.btn.pressing{border-image-source:var(--img-p);transform:translateY(.125rem) scale(.96);transition-duration:var(--d1)}
.btn.rel{animation:release .38s var(--e-spring)}
.btn[aria-disabled=true],.btn.is-dis{border-image-source:var(--img-d);color:var(--glyph-dis);text-shadow:none;cursor:not-allowed}
.btn[aria-disabled=true] .ic{filter:none;opacity:.8}
.btn:focus-visible,.btn.is-focus,.ibtn:focus-visible,.ibtn.is-focus,.tab:focus-visible,.chip:focus-visible,.card:focus-visible,.tile:focus-visible,.slot:focus-visible,.lrow:focus-visible{outline:none;filter:drop-shadow(0 0 .0625rem var(--focus)) drop-shadow(0 0 .0625rem var(--focus)) drop-shadow(0 0 .45rem var(--focus-glow))}
.btn.sm{--bw:.75rem;--c:.33rem;min-height:2.25rem;padding:.15rem .95rem .38rem;font-size:1.0625rem}
.btn.xs{--bw:.625rem;--c:.27rem;min-height:1.875rem;padding:.1rem .7rem .3rem;font-size:.9375rem;letter-spacing:.06em}
.btn.lg{--bw:1.25rem;--c:.55rem;min-height:3.5rem;padding:.2rem 2rem .6rem;font-size:1.625rem}
.btn.xl{--bw:1.5rem;--c:.66rem;min-height:5.5rem;padding:.2rem 2.5rem .8rem;font-size:2.75rem;letter-spacing:.08em}
.btn.dark{--img:var(--i-dark);--img-h:var(--i-dark-h);--img-p:var(--i-dark-p);--img-d:var(--i-dark-d);color:var(--text-gold);text-shadow:0 .0625rem 0 rgba(0,0,0,.8)}
.btn.dark .ic{filter:none}
.btn.dark::after{opacity:0}
.btn.dark[aria-disabled=true]{color:var(--text-3)}
.btn.red{--img:var(--i-red);--img-h:var(--i-red-h);--img-p:var(--i-red-p);--img-d:var(--i-red-d);color:var(--text-on-red);text-shadow:0 .0625rem 0 rgba(40,0,0,.7)}
.btn.red .ic{filter:none}
.btn.red::after{opacity:.35}
.btn.red[aria-disabled=true]{color:#A8908A}
.btn.block{display:flex;width:100%}
.btn .sub{font:600 .8em/1 var(--f-display);opacity:.8;letter-spacing:.05em}
.btn .price{display:inline-flex;align-items:center;gap:.25em}
.btn .price .cur-i{width:1.15em;height:1.15em}
.btn.busy{pointer-events:none}
.btn.busy>*{visibility:hidden}
.btn.busy .shn{display:none}
.btn .spin{position:absolute;left:50%;top:44%;width:1.4rem;height:1.4rem;margin:-.7rem;border:.2rem solid rgba(86,44,0,.25);border-top-color:var(--glyph);border-radius:50%;animation:spin .7s linear infinite;visibility:visible}
@keyframes shine{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
@keyframes release{0%{transform:scale(.96)}55%{transform:scale(1.04) translateY(-.0625rem)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.35rem)}40%{transform:translateX(.3rem)}60%{transform:translateX(-.22rem)}80%{transform:translateX(.12rem)}}
.shake{animation:shake .34s var(--e-io)!important}

/* Icon-Knopf (quadratisch wie im Sheet) */
.ibtn{--c:.45rem;--bw:1rem;--img:var(--i-gold);--img-h:var(--i-gold-h);--img-p:var(--i-gold-p);--img-d:var(--i-gold-d);
  position:relative;isolation:isolate;display:inline-grid;place-items:center;width:3.25rem;height:3.25rem;padding:0 0 .25rem;border-image:var(--img) 16 fill / var(--bw) / 0 stretch;color:var(--glyph);
  transition:transform var(--d3) var(--e-back),filter var(--d2);cursor:pointer;flex:none}
.ibtn .ic{position:relative;z-index:2;width:1.75rem;height:1.75rem;filter:drop-shadow(0 .0625rem 0 var(--glyph-hl))}
.ibtn::after{content:"";position:absolute;inset:.1875rem .1875rem .4375rem;clip-path:var(--oct);background:var(--tex) 0 0/11rem 11rem;mix-blend-mode:multiply;opacity:.5;pointer-events:none;z-index:-1}
@media (hover:hover){
  .ibtn:hover:not([aria-disabled=true]),.ibtn.is-hover{border-image-source:var(--img-h);transform:translateY(-.125rem)}
  .ibtn:hover:not([aria-disabled=true]) .shn::before,.ibtn.is-hover .shn::before{animation:shine .75s var(--e-out)}
}
.ibtn:active:not([aria-disabled=true]),.ibtn.is-press{border-image-source:var(--img-p);transform:translateY(.125rem) scale(.94);transition-duration:var(--d1)}
.ibtn.rel{animation:release .38s var(--e-spring)}
.ibtn[aria-disabled=true],.ibtn.is-dis{border-image-source:var(--img-d);color:var(--glyph-dis);cursor:not-allowed}
.ibtn.sm{--bw:.75rem;--c:.34rem;width:2.5rem;height:2.5rem;padding-bottom:.2rem}
.ibtn.sm .ic{width:1.3rem;height:1.3rem}
.ibtn.xs{--bw:.625rem;--c:.28rem;width:2rem;height:2rem;padding-bottom:.15rem}
.ibtn.xs .ic{width:1.05rem;height:1.05rem}
.ibtn.lg{--bw:1.25rem;--c:.55rem;width:4.25rem;height:4.25rem}
.ibtn.lg .ic{width:2.3rem;height:2.3rem}
.ibtn.dark{--img:var(--i-dark);--img-h:var(--i-dark-h);--img-p:var(--i-dark-p);--img-d:var(--i-dark-d);color:var(--text-gold)}
.ibtn.dark .ic{filter:none}
.ibtn.dark::after{opacity:0}
.ibtn.red{--img:var(--i-red);--img-h:var(--i-red-h);--img-p:var(--i-red-p);--img-d:var(--i-red-d);color:var(--text-gold)}
.ibtn.red .ic{filter:drop-shadow(0 .0625rem 0 rgba(0,0,0,.5))}
.ibtn.ghost{border-image:none;background:none;color:var(--text-2);width:2.25rem;height:2.25rem;padding:0}
.ibtn.ghost::after,.ibtn.ghost .shn{display:none}
.ibtn.ghost:hover{color:var(--text-gold)}
.ibtn.on{--img:var(--i-gold);color:var(--glyph)}

/* Zähler-Badge, NEU, Marken */
.cnt{position:absolute;top:-.45rem;right:-.45rem;min-width:1.375rem;height:1.375rem;padding:0 .3rem;display:grid;place-items:center;background:linear-gradient(#E0473A,#A51D14);color:#fff;border:.125rem solid #2A0402;
  clip-path:polygon(.3rem 0,calc(100% - .3rem) 0,100% .3rem,100% calc(100% - .3rem),calc(100% - .3rem) 100%,.3rem 100%,0 calc(100% - .3rem),0 .3rem);font:700 .875rem/1 var(--f-display);letter-spacing:.02em;z-index:3;pointer-events:none}
.cnt.dot{min-width:.75rem;width:.75rem;height:.75rem;padding:0;top:-.2rem;right:-.2rem}
.cnt.gold{background:linear-gradient(#FFE07A,#F9A50E);color:var(--glyph);border-color:var(--gold-outline)}
.cnt.pulse{animation:cntPulse 1.6s var(--e-io) infinite}
.cnt.bump{animation:cntBump .5s var(--e-spring)}
@keyframes cntPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes cntBump{0%{transform:scale(.4)}100%{transform:scale(1)}}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:.3em;height:1.375rem;padding:0 .5rem;font:700 .8125rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  clip-path:polygon(.25rem 0,calc(100% - .25rem) 0,100% .25rem,100% calc(100% - .25rem),calc(100% - .25rem) 100%,.25rem 100%,0 calc(100% - .25rem),0 .25rem);background:linear-gradient(#FFD452,#F2A10E);color:var(--glyph)}
.tag .ic{width:1em;height:1em}
.tag.neu{background:linear-gradient(#9BE05A,#4E8A1E);color:#0E2200}
.tag.red{background:linear-gradient(#E0503F,#9E2016);color:#fff}
.tag.blue{background:linear-gradient(#6FB3EF,#2462A5);color:#fff}
.tag.dark{background:#1A140C;color:var(--text-gold);box-shadow:inset 0 0 0 .0625rem var(--frame)}
.tag.grey{background:#2A2721;color:var(--text-2)}
.tag.live::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* Panels: dunkel, abgeschrägt, dünner goldener Doppelrahmen */
.panel{position:relative;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;padding:1.25rem 1.375rem}
.panel.soft{border-image-source:var(--i-panel-soft)}
.panel.tight{padding:.875rem 1rem}
.panel.plq-top{padding-top:2.25rem;margin-top:1rem}
.plq{position:absolute;left:50%;top:-1rem;transform:translateX(-50%);min-width:55%;height:2.25rem;display:grid;place-items:center;padding:0 1.5rem .3rem;border-image:var(--i-gold) 16 fill / .75rem / 0 stretch;color:var(--glyph);font:700 1.125rem/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;text-shadow:0 .0625rem 0 var(--glyph-hl);z-index:2}
.ptitle{display:flex;align-items:center;gap:.6rem;margin:0 0 .875rem;font:700 1.125rem/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-gold)}
.ptitle .ic{width:1.25rem;height:1.25rem}
.ptitle .sp+span{font:600 .9375rem/1 var(--f-display);letter-spacing:.06em;color:var(--text-3)}
.ptitle .sp{display:none}   /* Linie steht zwischen Titel und rechter Angabe */
.ptitle .sp~*{order:6}
.ptitle.noline .sp{display:block}
.ptitle::after{content:"";flex:1 1 auto;height:.0625rem;background:linear-gradient(90deg,var(--frame-dim),transparent);order:5}
.ptitle.noline::after{display:none}
.sect{font:700 1rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:1.25rem 0 .625rem;display:flex;gap:.6rem;align-items:center}
.sect::after{content:"";flex:1;height:.0625rem;background:var(--frame-faint)}

/* Karte (klickbar) */
.card{position:relative;display:block;text-align:left;border-image:var(--i-card) 18 fill / 1.125rem / 0 stretch;padding:1rem 1.125rem;transition:transform var(--d3) var(--e-back),filter var(--d2);color:var(--text)}
button.card,a.card,.card.click{cursor:pointer}
@media (hover:hover){button.card:hover,.card.click:hover{border-image-source:var(--i-card-h);transform:translateY(-.1875rem)}}
.card.sel{border-image-source:var(--i-card-s)}
button.card:active,.card.click:active{transform:translateY(.0625rem) scale(.985);transition-duration:var(--d1)}

/* Prunkrahmen (legendär) */
.frame-o{position:relative;border-image:var(--i-ornate) 22 fill / 1.375rem / 0 stretch;padding:1.75rem 1.5rem 1.5rem}
.frame-o::before{content:"";position:absolute;left:50%;top:-.8rem;width:1.7rem;height:1.7rem;transform:translateX(-50%);background:var(--i-diamond) center/contain no-repeat;filter:drop-shadow(0 0 .4rem rgba(255,200,80,.5))}

/* Eingabefeld */
.field{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.25rem .875rem;border-image:var(--i-field) 7 fill / 0.4375rem / 0 stretch;color:var(--text);transition:filter var(--d2)}
.field:focus-within{border-image-source:var(--i-field-f);filter:drop-shadow(0 0 .3rem rgba(255,190,60,.35))}
.field input,.field textarea{flex:1 1 auto;min-width:0;background:none;border:0;color:var(--text);font-size:1.0625rem}
.field textarea{resize:none;min-height:4.5rem;padding:.35rem 0}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field .ic{color:var(--text-3);width:1.25rem;height:1.25rem}
.lbl{display:block;font:700 .9375rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:0 0 .4rem}

/* Reiter (Sheet: aktive Gold-Platte, inaktive dunkel mit Goldkontur, Grundlinie) */
.tabs{position:relative;display:flex;align-items:flex-end;gap:.25rem}
.tab{--c:.45rem;position:relative;height:3rem;padding:0 1.15rem .1rem;display:inline-flex;align-items:center;gap:.5rem;border-image:var(--i-tab-off) 10 fill / 0.625rem / 0 stretch;color:var(--text-2);font:700 1.25rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:color var(--d2),transform var(--d3) var(--e-back);flex:none}
.tab .ic{width:1.35rem;height:1.35rem}
@media (hover:hover){.tab:hover:not(.on){border-image-source:var(--i-tab-off-h);color:var(--text);transform:translateY(-.125rem)}}
.tab.on{border-image-source:var(--i-tab-on);color:var(--glyph);text-shadow:0 .0625rem 0 var(--glyph-hl)}
.tab.on .ic{filter:drop-shadow(0 .0625rem 0 var(--glyph-hl))}
.tab.red{border-image-source:var(--i-tab-red);color:#FFD9CF}
.tab.red.on{border-image-source:var(--i-red);color:var(--text-on-red)}
.tabs-base{position:absolute;left:0;right:0;bottom:-.125rem;height:.1875rem;background:linear-gradient(var(--frame-hi),var(--frame));pointer-events:none}
.glide{position:absolute;left:0;bottom:-.3125rem;height:.3125rem;width:6.25rem;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#FFE07A 15%,#FFF4CF 50%,#FFE07A 85%,transparent);box-shadow:0 0 .75rem rgba(255,200,80,.8);border-radius:.2rem;pointer-events:none;transition:transform var(--d4) var(--e-back);z-index:2}

/* Unterreiter (Text mit Unterstrich) */
.subtabs{position:relative;display:flex;gap:.25rem;align-items:stretch}
.stab{position:relative;height:var(--sub-h);padding:0 1rem;display:inline-flex;align-items:center;gap:.45rem;font:700 1.125rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;transition:color var(--d2);flex:none}
.stab:hover{color:var(--text)}
.stab.on{color:var(--text-gold)}
.stab .k{font:600 .75rem/1 var(--f-display);color:var(--text-3);border:.0625rem solid #4A3416;padding:.12rem .25rem;border-radius:.2rem;opacity:.8}
.stab .cnt{position:static;transform:none}
.stab .tag{height:1.125rem;font-size:.6875rem;padding:0 .35rem}
.subglide{position:absolute;left:0;bottom:0;height:.1875rem;width:6.25rem;transform-origin:0 50%;background:linear-gradient(90deg,#FFE07A,#F9A50E);box-shadow:0 0 .5rem rgba(255,190,60,.7);transition:transform var(--d4) var(--e-back);pointer-events:none}

/* Chips / Segmente */
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{--c:.3rem;position:relative;height:2.25rem;padding:0 .95rem .1rem;display:inline-flex;align-items:center;gap:.4rem;border-image:var(--i-chip) 7 fill / 0.4375rem / 0 stretch;color:var(--text-2);font:700 1rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;transition:transform var(--d3) var(--e-back),color var(--d2);flex:none}
.chip .ic{width:1.1rem;height:1.1rem}
@media (hover:hover){.chip:hover:not(.on):not([aria-disabled=true]){color:var(--text);border-image-source:var(--i-chip-h);transform:translateY(-.0625rem)}}
.chip:active:not([aria-disabled=true]){transform:scale(.95)}
.chip.on{border-image-source:var(--i-chip-on);color:var(--glyph);text-shadow:0 .0625rem 0 var(--glyph-hl)}
.chip[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.chip .cnt{position:static;height:1.125rem;min-width:1.125rem;font-size:.75rem}
.chip small{font:600 .8125rem/1 var(--f-display);opacity:.75;letter-spacing:.04em;text-transform:none}

/* Fortschrittsbalken (Füllung per transform) */
.bar{--v:0;--fill:linear-gradient(#FFE38A,#FBB21D 38%,#F29A0C);position:relative;height:1.125rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch;flex:1 1 auto;min-width:3rem}
.bar>.in{position:absolute;inset:.25rem;overflow:hidden;clip-path:polygon(.15rem 0,calc(100% - .15rem) 0,100% .15rem,100% calc(100% - .15rem),calc(100% - .15rem) 100%,.15rem 100%,0 calc(100% - .15rem),0 .15rem)}
.bar>.in>i{position:absolute;inset:0;overflow:hidden;background:var(--fill);transform:translateX(calc((var(--v) - 1) * 100%));transition:transform var(--d5) var(--e-out)}
.bar>.in>i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 0 35%,rgba(255,255,255,.55) 50%,transparent 65% 100%);transform:translateX(-100%);animation:shimmer 2.4s var(--e-io) infinite}
.bar>.in>i::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;background:rgba(255,255,255,.28)}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.bar.sm{height:.875rem}
.bar.sm>.in{inset:.1875rem}
.bar.lg{height:1.5rem}
.bar.green{--fill:linear-gradient(#B4EC72,#6CB233 40%,#3E7A14)}
.bar.red{--fill:linear-gradient(#FF8A78,#D93233 40%,#981714)}
.bar.blue{--fill:linear-gradient(#8FD0FF,#2C8BD6 40%,#1D5EA0)}
.bar.purple{--fill:linear-gradient(#D5A6FF,#9A55DE 40%,#5E2A9C)}
.bar.grey{--fill:linear-gradient(#C5CBD2,#8A939C 40%,#5D646C)}
.bar.done>.in>i{--fill:linear-gradient(#B4EC72,#6CB233 40%,#3E7A14);background:var(--fill)}

/* Schalter (Sheet: grüne Spur an, dunkel aus, goldener Knauf) */
.tgl{position:relative;width:4.25rem;height:2.125rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch;flex:none;cursor:pointer;transition:filter var(--d2)}
.tgl::before{content:"";position:absolute;inset:.25rem;background:linear-gradient(#264A04,#192F01);clip-path:polygon(.15rem 0,calc(100% - .15rem) 0,100% .15rem,100% calc(100% - .15rem),calc(100% - .15rem) 100%,.15rem 100%,0 calc(100% - .15rem),0 .15rem);opacity:0;transition:opacity var(--d3)}
.tgl::after{content:"";position:absolute;left:.25rem;top:.2rem;width:1.75rem;height:1.6rem;border-image:var(--i-gold) 16 fill / .5rem / 0 stretch;transform:translateX(0);transition:transform var(--d4) var(--e-spring)}
.tgl[aria-checked=true]::before{opacity:1}
.tgl[aria-checked=true]::after{transform:translateX(2rem)}
.tgl:hover{filter:brightness(1.12)}
.tgl[aria-disabled=true]{opacity:.5;cursor:not-allowed}

/* Checkbox */
.chk{position:relative;width:2rem;height:2rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--glyph)}
.chk::before{content:"";position:absolute;inset:.1rem;border-image:var(--i-gold) 16 fill / .5rem / 0 stretch;transform:scale(.4);opacity:0;transition:transform var(--d3) var(--e-spring),opacity var(--d2)}
.chk .ic{position:relative;width:1.3rem;height:1.3rem;transform:scale(0);transition:transform var(--d3) var(--e-spring) 40ms}
.chk[aria-checked=true]::before{transform:scale(1);opacity:1}
.chk[aria-checked=true] .ic{transform:scale(1)}

/* Regler (gold gefüllt, quadratischer Gold-Knauf) */
.sld{--v:.5;position:relative;height:2.25rem;flex:1 1 auto;min-width:6rem;cursor:pointer;touch-action:none;container-type:inline-size}
.sld .tr{position:absolute;left:0;right:0;top:50%;height:1.125rem;margin-top:-.5625rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch}
.sld .tr>.in{position:absolute;inset:.25rem;overflow:hidden}
.sld .tr>.in>i{position:absolute;inset:0;background:linear-gradient(#FFE38A,#FBB21D 38%,#F29A0C);transform:translateX(calc((var(--v) - 1) * 100%))}
.sld .kn{position:absolute;left:0;top:0;bottom:0;width:1.75rem;pointer-events:none;transform:translateX(calc(var(--v) * (100cqw - 1.75rem)))}
.sld .kn>b{position:absolute;left:0;top:50%;width:1.75rem;height:2.125rem;margin-top:-1.0625rem;border-image:var(--i-gold) 16 fill / .5625rem / 0 stretch;transition:filter var(--d2)}
.sld.drag .kn>b,.sld:focus-visible .kn>b{filter:drop-shadow(0 0 .45rem rgba(255,200,70,.95))}
.sld:focus-visible{outline:none}
.sld.anim .tr>.in>i,.sld.anim .kn{transition:transform var(--d3) var(--e-out)}
.sldv{min-width:3.5rem;text-align:right;font:700 1.0625rem/1 var(--f-display);letter-spacing:.04em;color:var(--text-gold);font-variant-numeric:tabular-nums}

/* Stufen-Regler mit Knoten */
.steps{--n:5;--i:0;position:relative;height:2.5rem;display:flex;align-items:center;justify-content:space-between;flex:1 1 auto;min-width:10rem}
.steps::before{content:"";position:absolute;left:.5rem;right:.5rem;top:50%;height:.75rem;margin-top:-.375rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch}
.steps .fillr{position:absolute;left:.75rem;right:.75rem;top:50%;height:.25rem;margin-top:-.125rem;overflow:hidden;pointer-events:none}
.steps .fillr i{position:absolute;inset:0;background:linear-gradient(#FFE38A,#F29A0C);transform-origin:0 50%;transform:scaleX(calc(var(--i) / (var(--n) - 1)));transition:transform var(--d4) var(--e-out)}
.steps button{position:relative;z-index:1;width:1.375rem;height:1.625rem;border-image:var(--i-gold) 16 fill / .45rem / 0 stretch;transition:transform var(--d3) var(--e-spring)}
.steps button.past{filter:none}
.steps button:not(.past):not(.on){border-image-source:var(--i-node-off)}
.steps button.on{transform:scale(1.45)}
.steps button:hover:not(.on){transform:scale(1.15)}
.steps button span{position:absolute;top:2.1rem;left:50%;transform:translateX(-50%);font:600 .8125rem/1 var(--f-display);color:var(--text-3);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.steps button.on span{color:var(--text-gold);transform:translate(-50%,-.525rem) scale(.69)}   /* hebt Knopf-Skalierung auf: Beschriftung bleibt auf einer Linie */

/* Auswahl-Stepper (< Wert >) */
.stepper{display:inline-flex;align-items:center;gap:.25rem;min-width:13rem}
.stepper .val{flex:1 1 auto;text-align:center;height:2.375rem;display:grid;place-items:center;padding:0 .75rem;border-image:var(--i-field) 7 fill / 0.4375rem / 0 stretch;font:600 1.0625rem/1 var(--f-body);white-space:nowrap;overflow:hidden}
.stepper .val span{display:inline-block;animation:valIn var(--d3) var(--e-out)}
.stepper .val span.l{animation-name:valInL}
@keyframes valIn{from{transform:translateX(.75rem);opacity:0}to{transform:none;opacity:1}}
@keyframes valInL{from{transform:translateX(-.75rem);opacity:0}to{transform:none;opacity:1}}

/* Fortschritts-Pfad */
.path{display:flex;align-items:center}
.path .nd{position:relative;width:2.5rem;height:2.5rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch;display:grid;place-items:center;color:var(--text-3);font:700 1rem/1 var(--f-display);flex:none}
.path .nd.done{border-image:var(--i-gold) 16 fill / .625rem / 0 stretch;color:var(--glyph);padding-bottom:.2rem}
.path .nd.now{border-image-source:var(--i-field-f);color:var(--text-gold);animation:nodeGlow 1.6s var(--e-io) infinite}
@keyframes nodeGlow{50%{filter:drop-shadow(0 0 .5rem rgba(255,200,70,.8))}}
.path .ln{flex:1 1 auto;height:.375rem;min-width:1rem;background:linear-gradient(#5A3A10,#2A1A06);box-shadow:inset 0 .0625rem 0 rgba(0,0,0,.6)}
.path .ln.done{background:linear-gradient(#FFD452,#E8920A);box-shadow:0 0 .4rem rgba(255,190,60,.4)}

/* Währungs-Pille (Sheet: Ressourcen-Leiste mit Symbol und „+“) */
.cur{position:relative;display:inline-flex;align-items:center;height:2.375rem;padding:0 .3rem 0 2.2rem;margin-left:.6rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch;gap:.35rem;flex:none}
.cur .cur-i{position:absolute;left:-.6rem;top:50%;width:2.6rem;height:2.6rem;margin-top:-1.3rem;filter:drop-shadow(0 .125rem .125rem rgba(0,0,0,.6))}
.cur .v{min-width:3.6rem;text-align:right;font:700 1.1875rem/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--text);padding-right:.25rem}
.cur .plus{--c:.25rem;width:1.75rem;height:1.75rem;display:grid;place-items:center;border-image:var(--i-gold) 16 fill / .5rem / 0 stretch;color:var(--glyph);padding-bottom:.1rem;transition:transform var(--d3) var(--e-back)}
.cur .plus .ic{width:1rem;height:1rem}
.cur .plus:hover{border-image-source:var(--i-gold-h);transform:translateY(-.0625rem)}
.cur .plus:active{transform:scale(.9)}
.cur.hit{animation:curHit .55s var(--e-spring)}
@keyframes curHit{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
.cur-i{width:1.4em;height:1.4em;flex:none;vertical-align:middle}

/* Rollen-Badges (unterste Reihe im Sheet) */
.role{position:relative;display:inline-grid;place-items:center;width:2.25rem;height:2.25rem;border-image:var(--i-role-player) 16 fill / .7rem / 0 stretch;flex:none;color:#C9DDF0}
.role .ic{width:1.2rem;height:1.2rem;filter:drop-shadow(0 .0625rem 0 rgba(0,0,0,.4))}
.role.owner{border-image-source:var(--i-role-crown);color:#FFC93A}
.role.admin{border-image-source:var(--i-role-admin);color:#FFC93A}
.role.dev{border-image-source:var(--i-role-dev);color:#D9D2E8}
.role.mod{border-image-source:var(--i-role-mod);color:#F2CF3A}
.role.sm{width:1.5rem;height:1.5rem;border-image-width:.5rem}
.role.sm .ic{width:.85rem;height:.85rem}
.role.lg{width:4rem;height:4rem;border-image-width:1rem}
.role.lg .ic{width:2.1rem;height:2.1rem}
.rolelbl{display:inline-flex;align-items:center;gap:.3rem;font:700 .8125rem/1 var(--f-display);letter-spacing:.08em}

/* Rang-Abzeichen */
.rank{position:relative;display:inline-grid;place-items:center;width:2.5rem;height:2.75rem;flex:none}
.rank svg{position:absolute;inset:0;width:100%;height:100%}
.rank b{position:relative;font:800 1.0625rem/1 var(--f-display);color:var(--glyph);letter-spacing:0;margin-top:-.1rem;text-shadow:0 .0625rem 0 var(--glyph-hl)}
.rank.lg{width:5.5rem;height:6rem}
.rank.lg b{font-size:2.25rem}
.rank.sm{width:1.75rem;height:1.95rem}
.rank.sm b{font-size:.8125rem}

/* Stufen */
.t-common{--tier:var(--t-common)} .t-uncommon{--tier:var(--t-uncommon)} .t-rare{--tier:var(--t-rare)} .t-epic{--tier:var(--t-epic)} .t-jackpot{--tier:var(--t-jackpot)}
.tierlbl{display:inline-flex;align-items:center;gap:.3rem;font:700 .875rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--tier)}
.tierlbl .ic{width:1rem;height:1rem}

/* Banner: Platte, Band, Wimpel */
.bplate{position:relative;display:inline-grid;place-items:center;min-width:14rem;height:3.25rem;padding:0 2.5rem .35rem;color:var(--glyph);font:800 1.5rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;text-shadow:0 .0625rem 0 var(--glyph-hl);background:var(--i-bplate-bg) center/100% 100% no-repeat}
.ribbon{position:relative;display:inline-grid;place-items:center;min-width:18rem;height:4.25rem;padding:0 4rem .9rem;color:var(--glyph);font:800 1.75rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 .0625rem 0 var(--glyph-hl);background:var(--i-ribbon) center/100% 100% no-repeat}
.pennant{position:relative;display:inline-grid;place-items:start center;width:7rem;height:7.5rem;padding-top:1.25rem;color:var(--glyph);font:800 1.5rem/1 var(--f-display);text-shadow:0 .0625rem 0 var(--glyph-hl);background:var(--i-pennant) center/100% 100% no-repeat}
.ribbon.red{background-image:var(--i-ribbon-red);color:var(--text-on-red);text-shadow:0 .0625rem 0 rgba(0,0,0,.5)}

/* Listenzeilen */
.lrow{position:relative;display:flex;align-items:center;gap:.875rem;min-height:3.5rem;padding:.5rem .875rem;border-image:var(--i-row) 8 fill / 0.5rem / 0 stretch;transition:transform var(--d3) var(--e-back),filter var(--d2)}
.lrow.click{cursor:pointer}
@media (hover:hover){.lrow.click:hover,.lrow.hov:hover{border-image-source:var(--i-row-h)}}
.lrow.sel{border-image-source:var(--i-row-s)}
.lrow.me{border-image-source:var(--i-row-me)}
.lrows{display:grid;gap:.375rem}
.lhead{display:flex;align-items:center;gap:.875rem;padding:0 .875rem .25rem;font:700 .875rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}

/* Kacheln (Items) mit Stufen-Rahmen */
.tile{--tier:var(--t-common);position:relative;display:grid;align-content:start;justify-items:center;gap:.4rem;padding:.875rem .75rem .75rem;border-image:var(--i-tier-common) 12 fill / 0.75rem / 0 stretch;cursor:pointer;text-align:center;transition:transform var(--d3) var(--e-back),filter var(--d2);color:var(--text)}
.tile.t-uncommon{border-image-source:var(--i-tier-uncommon)} .tile.t-rare{border-image-source:var(--i-tier-rare)} .tile.t-epic{border-image-source:var(--i-tier-epic)} .tile.t-jackpot{border-image-source:var(--i-tier-jackpot)}
@media (hover:hover){.tile:hover{transform:translateY(-.25rem);filter:brightness(1.12) drop-shadow(0 .4rem .6rem rgba(0,0,0,.5))}}
.tile:active{transform:scale(.97);transition-duration:var(--d1)}
.tile.sel{filter:drop-shadow(0 0 .1rem #FFF4CF) drop-shadow(0 0 .55rem var(--tier))}
.tile .art{width:5.5rem;height:4.25rem;display:grid;place-items:center}
.tile .art svg{width:100%;height:100%}
.tile .nm{font:700 1.0625rem/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tile .ty{font-size:.875rem;color:var(--text-3)}
.tile .badges{position:absolute;top:.5rem;left:.5rem;right:.5rem;display:flex;justify-content:space-between;pointer-events:none}
.tile .lock{position:absolute;inset:0;display:grid;place-content:start center;padding-top:1.35rem;justify-items:center;gap:.25rem;background:rgba(0,4,10,.78);font:700 .9375rem/1 var(--f-display);letter-spacing:.08em;color:var(--text-2);text-transform:uppercase;clip-path:polygon(.6rem 0,calc(100% - .6rem) 0,100% .6rem,100% calc(100% - .6rem),calc(100% - .6rem) 100%,.6rem 100%,0 calc(100% - .6rem),0 .6rem)}
.tile .lock .ic{width:1.75rem;height:1.75rem;color:var(--text-gold)}
.stars{display:inline-flex;gap:.1rem;color:#5B4A2C}
.stars .ic{width:1rem;height:1rem}
.stars .on{color:#FFC93A;filter:drop-shadow(0 0 .2rem rgba(255,190,60,.6))}

/* Tastenhinweise im Konsolen-Stil */
.kh{display:inline-flex;align-items:center;gap:.4rem;font:600 .9375rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
button.kh:hover{color:var(--text)}
.key{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;padding:0 .35rem;background:linear-gradient(#2A2216,#15100A);border:.0625rem solid #6B4A1A;border-bottom-width:.1875rem;border-radius:.25rem;color:var(--text);font:700 .8125rem/1 var(--f-display);letter-spacing:.02em}
.pad{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;font:800 .8125rem/1 var(--f-display);color:#fff;letter-spacing:0;box-shadow:inset 0 -.125rem 0 rgba(0,0,0,.35)}
.pad.a{background:#3E9A43}.pad.b{background:#C8403A}.pad.x{background:#3576CF}.pad.y{background:#D4A31C;color:#2A1A00}
.pad.bump{width:auto;min-width:2.2rem;padding:0 .4rem;border-radius:.45rem;background:#34302A;color:var(--text);font-size:.75rem}
.pad.trig{width:auto;min-width:2.1rem;padding:0 .35rem;border-radius:.6rem .6rem .3rem .3rem;background:#34302A;color:var(--text);font-size:.75rem}
html:not(.pad-mode) .pad-only{display:none!important}
html.pad-mode .key-only{display:none!important}

/* Platzhalter-Bilder */
.thumb{position:relative;display:block;overflow:hidden;background:#0A1426;clip-path:polygon(.45rem 0,calc(100% - .45rem) 0,100% .45rem,100% calc(100% - .45rem),calc(100% - .45rem) 100%,.45rem 100%,0 calc(100% - .45rem),0 .45rem)}
.thumb>svg{display:block;width:100%;height:100%}
.wsvg{display:block;width:100%;height:100%}
.wbox{display:block;flex:none}
.wbox>svg{display:block;width:100%;height:100%}
.thumb .ov{position:absolute;inset:auto .5rem .5rem .5rem;display:flex;gap:.35rem;justify-content:space-between;align-items:flex-end}

/* ---------- Ebenen ---------- */
#app{position:fixed;inset:0;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.layer{position:absolute;inset:0}
#world{z-index:0;display:block;width:100%;height:100%;transform-origin:50% 45%;transition:filter var(--d4) var(--e-out),transform var(--d5) var(--e-out)}
#ambient{z-index:1;pointer-events:none;background:radial-gradient(60% 40% at 50% 100%,rgba(255,170,60,.10),transparent 70%)}
body.blur-hub #world{filter:blur(.55rem) brightness(.5) saturate(1.15);transform:scale(1.05)}
body.blur-hub.on-lobby #world{filter:blur(.22rem) brightness(.78) saturate(1.1);transform:scale(1.03)}
body.blur-soft #world{filter:blur(.25rem) brightness(.62)}
body.blur-soft #hud{opacity:.35}
body.blur-hard #world{filter:blur(.7rem) brightness(.3)}
#hud{z-index:10;pointer-events:none;transition:opacity var(--d3),visibility 0s}
body.blur-hub #hud{opacity:0;visibility:hidden;transition:opacity var(--d3),visibility 0s linear var(--d3)}
#hud .pe{pointer-events:auto}
#screen{z-index:43;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
#tablist{z-index:35;pointer-events:none}
#hub{z-index:40}
#escm{z-index:40}
#plotwin{z-index:41}
#social{z-index:42}
#settings{z-index:44}
#dlg{z-index:50;pointer-events:none}
#popup{z-index:58;pointer-events:none}
#fx{z-index:66;pointer-events:none;position:absolute;inset:0;width:100%;height:100%}
#toasts{z-index:70;pointer-events:none}
#notifs{z-index:71;pointer-events:none}
#sys{z-index:100}
#proto{z-index:200}

/* Ein-/Ausblenden der Ebenen: nur opacity/transform */
.fade{opacity:0;visibility:hidden;transition:opacity var(--d3) var(--e-out),visibility 0s linear var(--d3)}
.fade.show{opacity:1;visibility:visible;transition:opacity var(--d3) var(--e-out),visibility 0s}
.stg>*{isolation:isolate;animation:stgIn var(--d4) var(--e-out) backwards;animation-delay:calc(var(--i,0) * 35ms)}   /* eigene Ebene wie bisher durch den gehaltenen Endzustand – Endwerte überschreiben aber keine Zustände mehr */
@keyframes stgIn{from{opacity:0;transform:translateY(.75rem)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateX(var(--dir,1.5rem))}to{opacity:1;transform:none}}

/* ---------- HUB (nur Plaza) ---------- */
#hub{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top-h) auto minmax(0,1fr) var(--foot-h);pointer-events:none;visibility:hidden;transition:visibility 0s linear var(--d4)}
#hub.show{visibility:visible;pointer-events:auto;transition:visibility 0s}
#hub .content{opacity:0;transform:translateY(.75rem);transition:opacity var(--d3) var(--e-out),transform var(--d4) var(--e-out)}
#hub.show .content{opacity:1;transform:none}
#hub .hbg{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,4,10,.92) 0,rgba(0,4,10,.55) 22%,rgba(0,4,10,.5) 70%,rgba(0,4,10,.9) 100%);opacity:0;transition:opacity var(--d4) var(--e-out)}
#hub.dim .hbg{background:linear-gradient(180deg,rgba(0,4,10,.95) 0,rgba(0,4,10,.8) 30%,rgba(0,4,10,.84) 100%)}
#hub.show .hbg{opacity:1}
.top{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1.25rem;padding:0 1.5rem 0 1.75rem;background:linear-gradient(180deg,rgba(6,6,8,.97),rgba(10,9,8,.9));transform:translateY(-105%);transition:transform var(--d4) var(--e-out)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.1875rem;background:linear-gradient(90deg,transparent,var(--frame) 12%,var(--frame-hi) 50%,var(--frame) 88%,transparent);box-shadow:0 .25rem 1rem rgba(255,170,40,.18)}
#hub.show .top{transform:none}
.logo{display:flex;align-items:center;gap:.6rem;font:800 2.125rem/1 var(--f-display);letter-spacing:.06em;color:var(--gold-1);text-shadow:0 .125rem 0 var(--gold-lip),0 .25rem 0 var(--gold-outline),0 0 1.2rem rgba(255,180,40,.25);user-select:none}
.logo svg{width:2.25rem;height:2.25rem;filter:drop-shadow(0 .15rem 0 var(--gold-outline))}
.tabwrap{display:flex;align-items:flex-end;justify-content:center;align-self:stretch;gap:.75rem;min-width:0}
.tabwrap .tabs{padding-bottom:.3rem}
.tabwrap .tabnav{align-self:center;margin-top:.25rem}
.tabwrap .tabs-base{display:none}
.tright{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}
.curs{display:flex;align-items:center;gap:.35rem}
.sbtn{display:inline-flex;align-items:center;gap:.4rem;height:2.5rem;padding:0 .75rem .2rem}
.sbtn .ol{font:700 1.0625rem/1 var(--f-display);color:var(--good)}
.prof{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem .2rem .2rem;border-radius:.3rem;transition:transform var(--d3) var(--e-back)}
.prof:hover{transform:translateY(-.125rem)}
.prof .ring{position:relative;width:3.125rem;height:3.125rem;display:grid;place-items:center}
.prof .ring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.prof .ring circle{fill:none;stroke-width:3}
.prof .nm{display:grid;line-height:1.05;text-align:left}
.prof .nm b{font:700 1.125rem/1 var(--f-display);letter-spacing:.04em}
.prof .nm span{font:600 .875rem/1.2 var(--f-display);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.subrow{position:relative;display:flex;justify-content:center;align-items:stretch;height:var(--sub-h);padding:0 var(--gut);background:linear-gradient(rgba(8,7,6,.85),rgba(8,7,6,.55));border-bottom:.0625rem solid var(--frame-faint);transform:translateY(-.5rem);opacity:0;transition:transform var(--d4) var(--e-out),opacity var(--d3)}
#hub.show .subrow{transform:none;opacity:1}
.subrow.none{height:0;border:0;overflow:hidden}
.subrow .trig{align-self:center;margin:0 .5rem}
.subrow .subtabs{overflow-x:auto;scrollbar-width:none}
.subrow .subtabs::-webkit-scrollbar{display:none}
.content{position:relative;min-height:0;overflow:hidden}
.pagewrap{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
.pagewrap.in{animation:pageIn var(--d4) var(--e-out) both}
.page{max-width:108rem;margin:0 auto;padding:1.5rem var(--gut) 2.5rem}
.phead{display:flex;align-items:flex-end;gap:1.5rem;margin:0 0 1.25rem;flex-wrap:wrap}
.phead h2{margin:0;font:800 2.25rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.phead h2 .tag{margin-left:.35rem;vertical-align:.35rem}
.phead p{margin:.35rem 0 0;color:var(--text-2);font-size:1.0625rem}
.phead .acts{margin-left:auto;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.phead .acts>.chips+.chips{padding-left:.9rem;margin-left:.3rem;border-left:.0625rem solid var(--frame-faint)}   /* zwei Chip-Gruppen sichtbar trennen */
.foot{position:relative;display:flex;align-items:center;gap:1.5rem;padding:0 1.75rem 0 calc(124px + 1rem);background:linear-gradient(rgba(6,6,8,.6),rgba(6,6,8,.95));border-top:.0625rem solid var(--frame-faint);transform:translateY(105%);transition:transform var(--d4) var(--e-out)}
#hub.show .foot{transform:none}
.status{display:flex;align-items:center;gap:.5rem;font:600 .9375rem/1 var(--f-display);letter-spacing:.06em;color:var(--text-3);text-transform:uppercase;white-space:nowrap;overflow:hidden;min-width:0}
.status .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--good);box-shadow:0 0 .5rem var(--good)}
.hints{margin-left:auto;display:flex;align-items:center;gap:1.4rem}
.hints .kh{gap:.3rem}

/* Such-Pille (schwebend, kein Layout-Sprung) */
.spill{position:absolute;right:1.5rem;top:calc(var(--top-h) + .75rem);z-index:5;display:flex;align-items:center;gap:.75rem;height:3rem;padding:0 .4rem 0 1rem;border-image:var(--i-panel) 18 fill / .875rem / 0 stretch;transform:translateY(-.5rem) scale(.96);opacity:0;pointer-events:none;transition:transform var(--d4) var(--e-back),opacity var(--d3)}
.spill.show{transform:none;opacity:1;pointer-events:auto}
.spill .pulse{position:relative;width:1.25rem;height:1.25rem;display:grid;place-items:center}
.spill .pulse::before,.spill .pulse::after{content:"";position:absolute;inset:.3rem;border-radius:50%;background:var(--gold-1)}
.spill .pulse::after{inset:0;background:none;border:.125rem solid var(--gold-1);animation:ring 1.4s var(--e-out) infinite}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.spill b{font:700 1.0625rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.spill .t{font:700 1.25rem/1 var(--f-display);color:var(--text-gold);font-variant-numeric:tabular-nums;min-width:2.8rem}

/* Dropdowns (System, Glocke) */
.dd{position:absolute;top:calc(var(--top-h) - .25rem);right:1.25rem;z-index:8;width:21rem;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;padding:.75rem;transform-origin:90% 0;animation:popIn var(--d3) var(--e-back) both}
.dd .item{display:flex;align-items:center;gap:.75rem;width:100%;padding:.7rem .75rem;border-radius:.2rem;font:700 1.125rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--text);text-align:left;transition:transform var(--d2) var(--e-back),background var(--d2)}
.dd .item .ic{width:1.35rem;height:1.35rem;color:var(--text-gold)}
.dd .item:hover,.dd .item:focus-visible{background:rgba(255,190,60,.1);transform:translateX(.25rem);outline:none}
.dd .item.red{color:#FF9B8A}
.dd .item.red .ic{color:#FF7A66}
.dd .sep{height:.0625rem;background:var(--frame-faint);margin:.35rem .5rem}
.dd .ddn{display:block;margin-left:auto;font:600 .8125rem/1 var(--f-display);color:var(--text-3);letter-spacing:.06em}
.dd.bell{width:26rem}
.nrow{display:flex;gap:.75rem;padding:.65rem .5rem;border-bottom:.0625rem solid var(--frame-faint);font-size:1rem}
.nrow:last-child{border:0}
.nrow .ic{width:1.5rem;height:1.5rem;color:var(--text-gold);flex:none;margin-top:.1rem}
.nrow small{display:block;color:var(--text-3);font-size:.875rem}
.nrow.new b::after{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:#E0473A;margin-left:.4rem;vertical-align:middle}

/* ---------- LOBBY ---------- */
.lobby{position:absolute;inset:0;display:grid;grid-template-columns:25rem minmax(0,1fr) 25rem;gap:var(--gut);padding:1.5rem var(--gut) 1.75rem;overflow:hidden}
.lobby .lcol{display:flex;flex-direction:column;gap:1rem;min-height:0;overflow:auto;scrollbar-width:none;padding:.25rem .25rem .5rem}
.lobby .lcol::-webkit-scrollbar{display:none}
.lobby .rcol{display:flex;flex-direction:column;justify-content:flex-end;gap:1rem;min-height:0}
.stage{position:relative;min-height:0}
.stage::before{content:"";position:absolute;left:18%;right:18%;top:-6%;bottom:12%;background:linear-gradient(180deg,rgba(255,220,140,.0),rgba(255,210,120,.07) 40%,rgba(255,190,80,.12));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);pointer-events:none}
.stage .floor{position:absolute;left:5%;right:5%;bottom:5%;height:20%;background:radial-gradient(50% 50% at 50% 50%,rgba(255,190,70,.28),rgba(255,160,40,.08) 55%,transparent 72%);border-radius:50%;filter:blur(.2rem)}
.stage .floor::after{content:"";position:absolute;inset:30% 18%;border-radius:50%;border:.125rem solid rgba(255,200,90,.35);box-shadow:0 0 1.5rem rgba(255,180,60,.3)}
.party{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;align-items:flex-end;gap:.8rem;transform-origin:50% 100%;transform:scale(var(--ps,1))}
.pm{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;gap:.5rem;width:12rem;animation:stgIn var(--d5) var(--e-out) backwards;animation-delay:calc(var(--i,0) * 90ms)}
.pm.big{width:16.5rem;z-index:2}
.pm.far{width:9rem;z-index:0;margin:0 -1.25rem;opacity:.9}
.pm .fig{position:relative;width:100%;aspect-ratio:3/4.3;display:grid;place-items:end center}
.pm .fig>svg{width:78%;height:auto;filter:drop-shadow(0 .5rem .6rem rgba(0,0,0,.55));animation:bob 3.2s var(--e-io) infinite;animation-delay:calc(var(--i,0) * -.7s)}
.pm.big .fig>svg{width:86%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.375rem)}}
.pm .crownf{position:absolute;top:-.25rem;left:50%;width:2.5rem;height:2.5rem;margin-left:-1.25rem;color:#FFC93A;filter:drop-shadow(0 0 .5rem rgba(255,190,50,.8));animation:bob 3.2s var(--e-io) infinite;animation-delay:-.4s}
.pm .crownf .ic{width:100%;height:100%}
.nplate{display:flex;align-items:center;gap:.5rem;padding:.4rem .75rem .4rem .45rem;border-image:var(--i-panel) 18 fill / .75rem / 0 stretch;max-width:100%}
.pm .ready{margin-top:-.2rem}
.mbar{position:absolute;display:grid;gap:.15rem;width:7rem;transform:translate(-50%,-50%);pointer-events:none}
.mbar span{font:700 .75rem/1 var(--f-display);letter-spacing:.06em;text-align:center;color:#FF9B8A;text-shadow:0 .0625rem .2rem #000}
.nplate b{font:700 1.125rem/1 var(--f-display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ready{font:700 .8125rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:.3rem .55rem;clip-path:polygon(.2rem 0,calc(100% - .2rem) 0,100% .2rem,100% calc(100% - .2rem),calc(100% - .2rem) 100%,.2rem 100%,0 calc(100% - .2rem),0 .2rem)}
.ready.y{background:#1E3A06;color:#9BE05A}
.ready.n{background:#2A2620;color:var(--text-3)}
.pm.vacant{padding-bottom:4.9625rem}   /* Namensschild + Bereit-Marke der Nachbarn: Geist steht auf derselben Bodenlinie */
.pm.vacant .fig{place-items:center}
.pm.vacant .ghost{position:absolute;inset:12% 22% 1.5%;display:flex;align-items:flex-end;justify-content:center;opacity:.28;color:#FFC93A}
.pm.vacant .ghost svg{width:100%;height:auto;animation:none;filter:none}   /* Füße auf der Bodenlinie der Nachbarn */
.pm.vacant .inv{position:relative;display:grid;justify-items:center;gap:.5rem;font:700 1rem/1 var(--f-display);letter-spacing:.1em;color:var(--text-2);text-transform:uppercase}
.carousel{position:relative;flex:none;overflow:hidden;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;padding:.375rem}
.car-track{position:relative;aspect-ratio:16/8.6;overflow:hidden;clip-path:polygon(.6rem 0,calc(100% - .6rem) 0,100% .6rem,100% calc(100% - .6rem),calc(100% - .6rem) 100%,.6rem 100%,0 calc(100% - .6rem),0 .6rem)}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(2rem);transition:opacity var(--d4) var(--e-out),transform var(--d4) var(--e-out);display:flex;flex-direction:column;justify-content:flex-end;padding:1rem 1.125rem;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.out{opacity:0;transform:translateX(-2rem)}
.slide .art{position:absolute;inset:0;z-index:-1}
.slide .art svg{width:100%;height:100%}
.slide .k{font:700 .875rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-gold);display:flex;gap:.5rem;align-items:center}
.slide h3{margin:.35rem 0 .25rem;font:800 1.75rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 .125rem .5rem rgba(0,0,0,.8)}
.slide p{margin:0 0 .6rem;font-size:1rem;color:var(--text-2);text-shadow:0 .0625rem .3rem rgba(0,0,0,.9);max-width:90%}
.car-dots{display:flex;gap:.4rem;justify-content:center;padding:.6rem 0 .25rem}
.car-dots button{position:relative;width:1.75rem;height:.375rem;background:#2E261A;overflow:hidden;clip-path:polygon(.15rem 0,100% 0,calc(100% - .15rem) 100%,0 100%)}
.car-dots button i{position:absolute;inset:0;background:var(--gold-1);transform-origin:0 50%;transform:scaleX(0)}
.car-dots button.on i{animation:dotFill 8s linear both}
.car-dots button.done i{transform:scaleX(1)}
@keyframes dotFill{to{transform:scaleX(1)}}
.carousel.paused .car-dots button.on i{animation-play-state:paused}
.bonus{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-image:var(--i-chip-on) 7 fill / 0.4375rem / 0 stretch;color:var(--glyph);font:700 1.0625rem/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.bonus .ic{width:1.4rem;height:1.4rem}
.bonus small{margin-left:auto;font-size:.875rem;opacity:.8}
.mis{display:grid;gap:.7rem}
.mis .m{display:grid;gap:.3rem}
.mis .m .row{gap:.5rem;font-size:1rem}
.mis .m .row b{font-weight:600}
.mis .m .row span{margin-left:auto;font:700 .9375rem/1 var(--f-display);color:var(--text-2);letter-spacing:.04em}
.mis .m.done .row span{color:var(--good)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.chest{position:relative;display:grid;justify-items:center;gap:.35rem;text-align:center;padding:1rem .75rem}
.chest .ch{width:4.5rem;height:3.75rem;animation:chestWiggle 3.5s var(--e-io) infinite}
@keyframes chestWiggle{0%,80%,100%{transform:none}84%{transform:rotate(-5deg) scale(1.05)}88%{transform:rotate(5deg) scale(1.05)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
.chest b{font:700 1.0625rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.chest small{color:var(--text-gold);font:700 .875rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.chest .cnt{top:.5rem;right:.6rem}
.modecard{display:grid;gap:.6rem}
.modecard .mtop{display:flex;align-items:center;gap:.85rem}
.modecard .mico{width:3.5rem;height:3.5rem;flex:none;display:grid;place-items:center;border-image:var(--i-gold) 16 fill / .75rem / 0 stretch;color:var(--glyph);padding-bottom:.2rem}
.modecard .mico .ic{width:2rem;height:2rem}
.modecard .mlab{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.15rem}
.modecard h3{margin:0 0 .3rem;font:800 1.5rem/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.modecard .meta{font-size:.9375rem;color:var(--text-2)}
.playbtn{width:100%}
.playbtn .ic{width:2.4rem;height:2.4rem}
.playbtn.searching{--img:var(--i-gold-p);--img-h:var(--i-gold-p);padding-inline:1.25rem;font-size:2.25rem}   /* Lupe + Text + Zeit passen in die Spalte */
.playhint{display:flex;justify-content:space-between;font:600 .9375rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:0 .25rem}

/* ---------- Seiten-Bausteine ---------- */
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr))}
.gauto-l{grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 30rem;gap:1.5rem;align-items:start}
.split.l{grid-template-columns:15rem minmax(0,1fr)}
.split.l3{grid-template-columns:15rem minmax(0,1fr) 28rem}
.sticky{position:sticky;top:0}
.sidenav{display:grid;gap:.3rem;align-content:start}
.sidenav button{position:relative;display:flex;align-items:center;gap:.6rem;height:2.75rem;padding:0 .9rem;font:700 1.0625rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);text-align:left;transition:transform var(--d2) var(--e-back),color var(--d2)}
.sidenav button::before{content:"";position:absolute;left:0;top:.35rem;bottom:.35rem;width:.1875rem;background:var(--gold-1);transform:scaleY(0);transition:transform var(--d3) var(--e-back);box-shadow:0 0 .5rem rgba(255,190,60,.6)}
.sidenav button:hover{color:var(--text);transform:translateX(.2rem)}
.sidenav button.on{color:var(--text-gold);background:linear-gradient(90deg,rgba(255,190,60,.14),transparent)}
.sidenav button.on::before{transform:scaleY(1)}
.sidenav button .ic{width:1.3rem;height:1.3rem}
.sidenav button .cnt,.sidenav button .tag{position:static;margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;font-size:1rem}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;text-align:right;font-weight:600}
.stat{display:grid;gap:.15rem;padding:.875rem 1rem;border-image:var(--i-row) 8 fill / 0.5rem / 0 stretch}
.stat b{font:800 1.875rem/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stat span{font:700 .875rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 .3rem;font-size:1rem}
.tbl th{font:700 .8125rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:.25rem .75rem;white-space:nowrap}
.tbl td{padding:.6rem .75rem;background:rgba(20,17,12,.82);border-top:.0625rem solid var(--frame-faint);border-bottom:.0625rem solid rgba(0,0,0,.4);white-space:nowrap}
.tbl td:first-child{border-left:.0625rem solid var(--frame-faint)}
.tbl td:last-child{border-right:.0625rem solid var(--frame-faint)}
.tbl tr.click{cursor:pointer}

/* ---------- Dialoge ---------- */
.dwrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;padding:1.5rem;pointer-events:auto}
.dwrap .scrim{position:absolute;inset:0;background:rgba(0,4,10,.62);backdrop-filter:blur(.35rem);-webkit-backdrop-filter:blur(.35rem);animation:fadeIn var(--d3) var(--e-out) both}
.dwrap.out .scrim{animation:fadeOut var(--d2) var(--e-out) both}
.dlg{position:relative;width:min(34rem,100%);max-height:calc(100% - 1rem);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;padding:2.75rem 1.5rem 1.25rem;margin-top:1rem;animation:popIn var(--d4) var(--e-back) both}
.dwrap.out .dlg{animation:popOut var(--d2) var(--e-out) both}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:scale(.95)}}
.dlg.mid{width:min(44rem,100%)}
.dlg.wide{width:min(56rem,100%)}
.dlg.xwide{width:min(76rem,100%)}
.dlg.ornate{border-image:var(--i-ornate) 22 fill / 1.375rem / 0 stretch;padding-top:3rem}
.dlg .dbody{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent;padding:0 .25rem}
.dlg .dbody p{margin:.25rem 0 .75rem;color:var(--text-2)}
.dlg .dfoot{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;padding-top:1.25rem}
.dlg .dclose{position:absolute;top:.6rem;right:.6rem}
.dlg .sub{text-align:center;margin:-.25rem 0 1rem;color:var(--text-2);font-size:1rem}
.spinner{width:3rem;height:3rem;border:.3rem solid rgba(255,190,60,.18);border-top-color:var(--gold-1);border-radius:50%;animation:spin .8s linear infinite;margin:1rem auto}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
.day{position:relative;display:grid;justify-items:center;gap:.35rem;padding:.75rem .25rem .6rem;border-image:var(--i-row) 8 fill / 0.5rem / 0 stretch;text-align:center}
.day b{font:700 .875rem/1 var(--f-display);letter-spacing:.1em;color:var(--text-3)}
.day .cur-i{width:2.25rem;height:2.25rem}
.day span{font:700 1rem/1 var(--f-display)}
.day.got{opacity:.55}
.day.got::after{content:"";position:absolute;inset:0;background:var(--i-check-stamp) center 58%/2.4rem no-repeat}
.day.got .cur-i{opacity:.25}
#dChest svg{width:10rem;height:8.4rem;display:block}
.day.today{border-image:var(--i-card-s) 18 fill / 1.125rem / 0 stretch;animation:nodeGlow 1.6s var(--e-io) infinite}
.day.big{grid-column:span 1}
.reward{display:grid;justify-items:center;gap:.75rem;text-align:center;padding:.5rem 0}
.reward .big{display:block;width:7rem;height:7rem;animation:rewardPop .8s var(--e-spring) both}
@keyframes rewardPop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.reward h3{margin:0;font:800 2.5rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.reward.fail h3{color:#FF8A78}
.crack{position:relative}
.wn{display:grid;gap:.75rem}
.wn .it{display:grid;grid-template-columns:2.5rem 1fr;gap:.75rem;align-items:start}
.wn .it .ic{width:2.25rem;height:2.25rem;color:var(--text-gold)}
.wn .it b{font:700 1.125rem/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.wn .it p{margin:.15rem 0 0!important;font-size:1rem}
.cdring{position:relative;width:5rem;height:5rem;margin:.5rem auto;display:grid;place-items:center;font:800 2rem/1 var(--f-display);color:var(--text-gold)}
.cdring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cdring circle{fill:none;stroke-width:4}

/* ---------- Toasts & Benachrichtigungen ---------- */
#toasts{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding-top:calc(var(--top-h) + 4.5rem)}
.toast{display:flex;align-items:center;gap:.7rem;max-width:min(36rem,calc(100vw - 2rem));padding:.65rem 1.1rem .65rem .8rem;border-image:var(--i-panel) 18 fill / .875rem / 0 stretch;font-size:1.0625rem;animation:toastIn var(--d4) var(--e-spring) both;pointer-events:auto}
.toast .ic{width:1.5rem;height:1.5rem;color:var(--text-gold);flex:none}
.toast.bad{border-image-source:var(--i-panel-red)}
.toast.bad .ic{color:#FF7A66}
.toast.good .ic{color:var(--good)}
.toast.out{animation:toastOut var(--d3) var(--e-out) both}
@keyframes toastIn{from{opacity:0;transform:translateY(-1.25rem) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-.75rem) scale(.96)}}
#notifs{display:flex;flex-direction:column;align-items:flex-end;gap:.75rem;padding:calc(var(--top-h) + .75rem) 1.25rem 0 0}
#app:has(#hub.show #spill.show) #notifs:not(.center){padding-top:calc(var(--top-h) + 4.5rem)}   /* Such-Pille bleibt sichtbar */
.notif{position:relative;width:25rem;max-width:calc(100vw - 2rem);display:grid;grid-template-columns:3.5rem 1fr;gap:.85rem;padding:1rem 1rem .9rem;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;pointer-events:auto;animation:notifIn var(--d4) var(--e-back) both}
.notif.out{animation:notifOut var(--d3) var(--e-out) both}
@keyframes notifIn{from{opacity:0;transform:translateX(2.5rem)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(2rem)}}
.notif .tring{position:relative;width:3.5rem;height:3.5rem;display:grid;place-items:center}
.notif .tring svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.notif .tring circle{fill:none;stroke-width:3}
.notif .tring circle.p{stroke:var(--gold-1);stroke-dasharray:100;stroke-dashoffset:0;animation:ringDown linear both;animation-duration:var(--dur,15s)}
@keyframes ringDown{to{stroke-dashoffset:100}}
.notif .tring .ic{width:1.6rem;height:1.6rem;color:var(--text-gold)}
.notif .tring b{position:absolute;bottom:-.3rem;font:700 .8125rem/1 var(--f-display);color:var(--text-2);background:var(--panel);padding:0 .25rem}
.notif h4{margin:0;font:700 1.125rem/1.15 var(--f-display);letter-spacing:.03em}
.notif p{margin:.2rem 0 .6rem;font-size:.9375rem;color:var(--text-2)}
.notif .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.notif .k{font:700 .75rem/1 var(--f-display);letter-spacing:.14em;color:var(--text-gold);text-transform:uppercase;margin-bottom:.25rem}

/* ---------- Popups (Belohnung) ---------- */
#popup .dwrap .scrim{background:radial-gradient(circle at 50% 45%,rgba(30,18,4,.55),rgba(0,4,10,.85))}

/* ---------- Tab-Liste (einheitlich) ---------- */
.tl-wrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;padding:4rem 2rem;opacity:0;visibility:hidden;transition:opacity var(--d2),visibility 0s linear var(--d2)}
.tl-wrap.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--d2),visibility 0s}
.tl-wrap.pinned{background:rgba(0,4,10,.4)}
.tlist{position:relative;width:min(84rem,100%);max-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;border-image:var(--i-panel) 18 fill / 1.125rem / 0 stretch;padding:1.25rem 1.5rem 1rem;transform:scale(.97);transition:transform var(--d3) var(--e-back)}
.tl-wrap.show .tlist{transform:none}
.tlist.narrow{width:min(52rem,100%)}
.tl-head{display:flex;align-items:center;gap:1.25rem;padding-bottom:.875rem;margin-bottom:.5rem;border-bottom:.0625rem solid var(--frame-faint);flex-wrap:wrap}
.tl-head h2{margin:0;font:800 2rem/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tl-head p{margin:.2rem 0 0;color:var(--text-2);font-size:1rem}
.tl-score{display:flex;align-items:center;gap:1rem;margin:0 auto;font:800 2.75rem/1 var(--f-display)}
.tl-score .b{color:var(--team-blue)} .tl-score .r{color:var(--team-red)}
.tl-score small{display:block;font:700 .875rem/1 var(--f-display);letter-spacing:.14em;text-align:center}
.tl-score .vs{font-size:1.5rem;color:var(--text-3)}
.tl-pin{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.tl-body{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#6A3F0A transparent}
.tl-cols{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:1.25rem}
.tl-team h3{display:flex;align-items:center;gap:.6rem;margin:.25rem 0 .5rem;font:800 1.25rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.tl-team.blue h3{color:var(--team-blue)} .tl-team.red h3{color:var(--team-red)} .tl-team.inf h3{color:#8BE04A}
.tl-team h3 small{margin-left:auto;font-size:.875rem;color:var(--text-3)}
.tl-row{display:grid;grid-template-columns:var(--tlc);align-items:center;gap:.6rem;min-height:2.75rem;padding:.25rem .6rem;margin:.2rem 0;border-image:var(--i-row) 8 fill / 0.5rem / 0 stretch;font-size:1rem;font-variant-numeric:tabular-nums}
.tl-row.h{border-image:none;min-height:1.5rem;font:700 .8125rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.tl-row.me{border-image-source:var(--i-row-me)}
.tl-row.dead{opacity:.55}
.tl-row .nm{display:flex;align-items:center;gap:.45rem;min-width:0;font-weight:600}
.tl-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row .r{text-align:right}
.tl-row .c{text-align:center}
.tl-row .ibtn.ghost{width:1.75rem;height:1.75rem}
.tl-row .ibtn.ghost .ic{width:1.25rem;height:1.25rem}
.tl-row.stg{isolation:isolate;animation:stgIn var(--d3) var(--e-out) backwards;animation-delay:calc(var(--i,0) * 22ms)}
.tl-foot{display:flex;align-items:center;gap:1rem;padding-top:.75rem;color:var(--text-3);font:600 .9375rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.rolechip{font:700 .75rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:.25rem .45rem;background:#2A2216;color:var(--text-2)}
.rolechip.owner{background:#3A2606;color:var(--text-gold)}
.rolechip.builder{background:#14300A;color:#9BE05A}

/* ---------- HUD (Match, Bauplatz, Plaza) ---------- */
.hud{position:absolute;inset:0}
.hud .tl{position:absolute;left:1.5rem;top:1.25rem}
.hud .tc{position:absolute;left:50%;top:1rem;transform:translateX(-50%);display:grid;justify-items:center;gap:.5rem}
.hud .trc{position:absolute;right:1.5rem;top:1.25rem}
.hud .bl{position:absolute;left:1.5rem;bottom:calc(1.5rem + 34px)}
.hud .bc{position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%)}
.hud .br{position:absolute;right:1.5rem;bottom:1.5rem}
.hpanel{border-image:var(--i-hud) 9 fill / 0.5625rem / 0 stretch;padding:.6rem .85rem}
.infobar{display:flex;align-items:center;gap:.6rem;font:700 1.0625rem/1 var(--f-display);letter-spacing:.05em;padding:.5rem .8rem}
.infobar .sep{width:.0625rem;height:1rem;background:var(--frame-dim)}
.radar{position:relative;width:12rem;height:12rem;border-radius:50%;background:radial-gradient(circle,rgba(20,40,60,.65),rgba(5,12,22,.85));border:.1875rem solid var(--frame);box-shadow:0 0 0 .1875rem var(--gold-outline),inset 0 0 1.5rem rgba(0,0,0,.8);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 1.9rem,rgba(212,181,92,.18) 1.9rem 2rem)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,200,80,.0) 0deg,rgba(255,200,80,.25) 40deg,transparent 41deg);animation:spin 3.5s linear infinite}
.radar .n{position:absolute;top:.3rem;left:50%;transform:translateX(-50%);font:800 .875rem/1 var(--f-display);color:var(--text-gold);z-index:2}
.radar .rg{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);font:700 .75rem/1 var(--f-display);color:var(--text-3);z-index:2}
.radar .me{position:absolute;left:50%;top:50%;width:0;height:0;border-left:.45rem solid transparent;border-right:.45rem solid transparent;border-bottom:.9rem solid #FFF4CF;transform:translate(-50%,-60%);z-index:2;filter:drop-shadow(0 0 .3rem #FFD452)}
.radar .d{position:absolute;width:.55rem;height:.55rem;border-radius:50%;z-index:1}
.radar .d.b{background:var(--team-blue);box-shadow:0 0 .4rem var(--team-blue)}
.radar .d.r{background:var(--team-red);box-shadow:0 0 .4rem var(--team-red);animation:blink 1s steps(2) infinite}
.mhead{display:flex;align-items:stretch;gap:0;filter:drop-shadow(0 .25rem .5rem rgba(0,0,0,.6))}
.mhead .ts{display:grid;place-items:center;min-width:6rem;padding:.3rem 1rem;font:800 2.25rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.mhead .ts.b{background:linear-gradient(#1F5BA0,#123A6A);color:#fff;clip-path:polygon(.6rem 0,100% 0,100% 100%,0 100%,0 .6rem)}
.mhead .ts.r{background:linear-gradient(#A8322A,#6E1A14);color:#fff;clip-path:polygon(0 0,calc(100% - .6rem) 0,100% .6rem,100% 100%,0 100%)}
.mhead .ts small{font:700 .75rem/1 var(--f-display);letter-spacing:.14em;opacity:.85}
.mhead .clock{display:grid;place-items:center;padding:.35rem 1.25rem .45rem;border-image:var(--i-gold) 16 fill / .75rem / 0 stretch;color:var(--glyph);min-width:8.5rem}
.mhead .clock b{font:800 2rem/1 var(--f-display);font-variant-numeric:tabular-nums;text-shadow:0 .0625rem 0 var(--glyph-hl)}
.mhead .clock small{font:800 .8125rem/1 var(--f-display);letter-spacing:.12em}
.lifebar{display:grid;gap:.25rem;width:30rem;padding:.45rem .7rem .55rem}
.lifebar .lt{display:flex;justify-content:space-between;font:800 1rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.killfeed{display:grid;gap:.3rem;justify-items:end}
.kf{display:flex;align-items:center;gap:.5rem;padding:.35rem .7rem;background:linear-gradient(90deg,rgba(6,6,8,.0),rgba(6,6,8,.82) 18%);font:700 1.0625rem/1 var(--f-display);letter-spacing:.03em;animation:kfIn var(--d4) var(--e-back) both;border-right:.1875rem solid var(--frame)}
.kf.me{border-right-color:#FFE07A;background:linear-gradient(90deg,rgba(60,40,6,0),rgba(60,40,6,.85) 18%)}
.kf .b{color:var(--team-blue)} .kf .r{color:var(--team-red)}
.kf .ic{width:1.6rem;height:1.6rem;color:var(--text)}
.kf .hs{width:1.1rem;height:1.1rem;color:#FFC93A}
@keyframes kfIn{from{opacity:0;transform:translateX(2rem)}to{opacity:1;transform:none}}
.chat{width:30rem;display:grid;gap:.15rem;font-size:1rem;text-shadow:0 .0625rem .2rem #000}
.chat .l{padding:.1rem .4rem;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent)}
.chat .l b{font-weight:600}
.chat .l.funk b{color:#7FD0FF}
.chat .l.sys{color:var(--text-gold)}
.chat .l.wh{color:#E3A5FF}
.chat .l.new{animation:stgIn var(--d3) var(--e-out) both}
.xh{position:absolute;left:50%;top:50%;width:0;height:0}
.xh i{position:absolute;background:#FFF4CF;box-shadow:0 0 .2rem rgba(0,0,0,.9);transition:transform var(--d2) var(--e-out)}
.xh i.u{width:.15rem;height:.8rem;left:-.075rem;top:-1.3rem;transform:translateY(calc(var(--sp,0) * -1rem))}
.xh i.d{width:.15rem;height:.8rem;left:-.075rem;top:.5rem;transform:translateY(calc(var(--sp,0) * 1rem))}
.xh i.l{height:.15rem;width:.8rem;top:-.075rem;left:-1.3rem;transform:translateX(calc(var(--sp,0) * -1rem))}
.xh i.r{height:.15rem;width:.8rem;top:-.075rem;left:.5rem;transform:translateX(calc(var(--sp,0) * 1rem))}
.xh i.c{width:.2rem;height:.2rem;left:-.1rem;top:-.1rem;border-radius:50%}
.hitm{position:absolute;left:50%;top:50%;width:2.6rem;height:2.6rem;margin:-1.3rem;opacity:0;pointer-events:none}
.hitm svg{width:100%;height:100%}
.hitm.go{animation:hitm .42s var(--e-out)}
@keyframes hitm{0%{opacity:1;transform:scale(1.5)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.hitmsg{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:grid;justify-items:center;gap:.15rem;pointer-events:none}
.hitmsg b{font:800 2rem/1 var(--f-display);letter-spacing:.1em;text-shadow:0 .125rem .5rem rgba(0,0,0,.9)}
.hitmsg span{font:700 1.125rem/1 var(--f-display);color:var(--text-2);letter-spacing:.05em}
.hitmsg.hs b{color:#FFD452}
.hitmsg.kill b{color:#FF6B5A}
.hitmsg.go{animation:hitmsg 1.2s var(--e-out) both}
@keyframes hitmsg{0%{opacity:0;transform:translateX(-50%) scale(1.6)}12%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-.5rem)}}
.vitals{display:grid;gap:.45rem;width:23rem}
.status-ic{display:flex;gap:1.15rem;min-height:2.75rem;align-items:flex-end;padding-bottom:.7rem}   /* Abstand nach Beschriftungsbreite, Schild darunter bleibt frei */
.sti{position:relative;flex:none;width:2.75rem;height:2.75rem;display:grid;place-items:center;animation:popIn var(--d3) var(--e-back) both}
.sti svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sti svg.r circle{fill:rgba(6,6,8,.8);stroke-width:3}
.sti svg.r circle.p{fill:none;stroke-dasharray:100;animation:ringDown linear both;animation-duration:var(--dur,10s)}
.sti .ic{position:relative;width:1.4rem;height:1.4rem}
.sti b{position:absolute;bottom:-.65rem;left:50%;transform:translateX(-50%);font:800 .625rem/1 var(--f-display);letter-spacing:.06em;white-space:nowrap;padding:.1rem .25rem;background:rgba(6,6,8,.85);color:var(--text-2)}
.vrow{display:grid;grid-template-columns:2.75rem auto 1fr;align-items:center;gap:.6rem;padding:.4rem .7rem .45rem .5rem}
.vrow .vi{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-image:var(--i-gold) 16 fill / .625rem / 0 stretch;color:var(--glyph);padding-bottom:.15rem}
.vrow .vi .ic{width:1.5rem;height:1.5rem}
.vrow.armor .vi{border-image-source:var(--i-blue)}
.vrow.armor .vi .ic{color:#E6F3FF}
.vrow.hp .vi{border-image-source:var(--i-red)}
.vrow.hp .vi .ic{color:#FFE9E4}
.vrow .vn{font:800 2.25rem/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:3.6rem;text-shadow:0 .125rem .3rem rgba(0,0,0,.8)}
.vrow.armor .vn{font-size:1.5rem;min-width:6.2rem}
.vrow .vn small{font-size:.9rem;color:var(--text-2);margin-left:.15rem}
.vbar{position:relative;height:1.125rem;border-image:var(--i-track) 6 fill / 0.375rem / 0 stretch}
.vbar .in{position:absolute;inset:.25rem;overflow:hidden}
.vbar .dchip{position:absolute;inset:0;border:0;padding:0;height:auto;background:rgba(255,240,220,.85);transform-origin:0 50%;transform:scaleX(var(--c,1));transition:transform .6s var(--e-out) .35s}
.vbar .val{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(var(--v,1))}
.vbar .val::before{content:"";position:absolute;left:0;right:0;top:0;height:35%;background:rgba(255,255,255,.3)}
.vbar.hp .val{background:linear-gradient(#FF8A78,#D93233 40%,#981714)}
.vbar.armor .val{background:linear-gradient(#8FD0FF,#2C8BD6 40%,#1D5EA0)}
.vbar .heal{position:absolute;inset:0;background:linear-gradient(100deg,transparent 0 30%,rgba(160,255,120,.95) 50%,transparent 70%);transform:translateX(-100%);opacity:0}
.vbar .heal.go{animation:healSweep .7s var(--e-out)}
@keyframes healSweep{0%{transform:translateX(-100%);opacity:1}100%{transform:translateX(100%);opacity:1}}
.vbar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - .0625rem),rgba(0,0,0,.55) calc(25% - .0625rem) 25%)}
.low .vbar.hp .val{animation:lowPulse .9s var(--e-io) infinite}
@keyframes lowPulse{50%{filter:brightness(1.7) saturate(1.3)}}
.vrow.armor.broken .vi{animation:blink .25s steps(2) 6}
.vign{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,20,10,.55) 100%)}
.low .vign,.vign.on{animation:vign 1s var(--e-io) infinite}
@keyframes vign{0%,100%{opacity:.35}50%{opacity:1}}
.spawnf{position:absolute;inset:.5rem;pointer-events:none;border:.1875rem solid rgba(255,212,82,.55);box-shadow:inset 0 0 2.5rem rgba(255,200,80,.25);clip-path:polygon(1.5rem 0,calc(100% - 1.5rem) 0,100% 1.5rem,100% calc(100% - 1.5rem),calc(100% - 1.5rem) 100%,1.5rem 100%,0 calc(100% - 1.5rem),0 1.5rem);animation:blink 1.2s steps(2) infinite}
