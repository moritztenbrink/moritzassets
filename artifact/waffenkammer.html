<title>Brick-Force Waffenkammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Asset-Sheet einer Waffenkammer – feste Tab-Leiste, links Zeilen wie im Projektil-Sheet, rechts Detail-Panel mit Simulatoren.
   Bewusst nur dunkel: Brünierter Stahl + Messing, wie das Referenz-Sheet. */
:root{
  --bg:#121419; --panel:#191c23; --panel-2:#20242d; --line:#2c313c; --line-2:#3a404d;
  --fg:#e8e4da; --muted:#9097a5; --faint:#5d6371;
  --brass:#d6a54e; --brass-2:#8f6328; --tracer:#fff1c9; --shell:#c23a2e;
  --z-brain:#e2584b; --z-head:#e8a33d; --z-body:#d6a54e; --z-arm:#5fa8e6; --z-foot:#a98be0;
  --good:#62c27a; --warn:#e3a63c; --bad:#e2584b; --info:#5fa8e6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}

main.wrap{padding-block:24px 64px}
.intro{color:var(--muted);max-width:72ch;margin:0 0 20px}
h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;text-wrap:balance;margin:0}
h2{font-size:32px;font-weight:700;line-height:1.05}
h3{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.12em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Zwei Spalten: Liste + Detail */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
@media (max-width:860px){.list{flex-direction:row;overflow-x:auto}.list .row{min-width:190px;border-bottom:0;border-right:1px solid var(--line)}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--brass)}
.row b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.row small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.row svg{width:96px;height:22px}

.detail{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.panel > h3{margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line-2);border-radius:999px;color:var(--muted);white-space:nowrap}
.chip.brass{color:var(--brass);border-color:var(--brass-2)}
.chip.new{color:var(--info);border-color:color-mix(in srgb,var(--info) 50%,var(--line))}
.chip.prop{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.lead{margin:6px 0 0;max-width:70ch}

.sheetstrip{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;align-items:center;background:linear-gradient(180deg,#0e1014,#15181e);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.sheetstrip svg{width:100%;height:auto;display:block}
.sheetstrip .imp{width:120px;height:80px}
.legend-mini{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--panel);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar i u{display:block;height:100%;background:linear-gradient(90deg,var(--brass-2),var(--brass));text-decoration:none}
.bar .mono{text-align:right;color:var(--muted);font-size:12px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.text-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.text-grid p{margin:4px 0 0;font-size:14px}
.text-grid h4{margin:0;font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}

/* Simulator */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin-bottom:12px}
.ctl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.ctl output{font-family:var(--f-mono);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--brass)}
input[type=range]{accent-color:var(--brass);width:150px}
.btn{background:var(--brass);color:#1a1307;border:0;border-radius:5px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);cursor:pointer}
label.check input{accent-color:var(--brass)}
.canvas-box{position:relative;background:#0d0f13;border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%}
.result{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.result b{font-family:var(--f-mono);font-weight:500}
.zone-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* Zeitleisten */
.tl{display:grid;gap:14px}
.tl-row{display:grid;grid-template-columns:120px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px}
.tl-track{position:relative;height:26px;background:var(--panel-2);border-radius:3px}
.tl-seg{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--brass) 22%,transparent);border-right:1px solid var(--bg);font-size:10px;color:var(--fg);padding:5px 6px 0;overflow:hidden;white-space:nowrap}
.tl-seg.hit{background:color-mix(in srgb,var(--bad) 45%,transparent)}
.tl-seg.calm{background:color-mix(in srgb,var(--faint) 40%,transparent)}
.tl-ev{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tracer)}
.tl-ev span{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.tl-head{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--info);box-shadow:0 0 8px var(--info);left:0;opacity:0}
.tl-row.has-ev{margin-bottom:14px}
.tl-row .mono{text-align:right;color:var(--muted)}

/* Tabellen */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted);background:var(--panel-2);position:sticky;top:0}
th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--brass)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
td.wrap-cell{white-space:normal;min-width:220px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select{background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 240px}

/* Karten (Consumables) */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 12px;align-content:start;overflow:hidden}
.card svg.icon{width:48px;height:56px;grid-row:span 3}
.card b{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.card .btn{grid-column:1 / -1;margin-top:10px;font-size:13px;padding:6px 10px}
.card .cd{position:absolute;inset:0;background:conic-gradient(color-mix(in srgb,var(--bg) 78%,transparent) var(--p,0%),transparent 0);pointer-events:none}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hpbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center}
.hp{position:relative;height:22px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#3e8f53,var(--good));transition:width .25s}
.hp i.shield{background:color-mix(in srgb,var(--warn) 70%,transparent);mix-blend-mode:screen}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.status{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
.toast{font-size:13px;color:var(--warn);min-height:20px}

.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line-2);padding-left:10px;margin:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono)}
svg text{font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function parseOv(s){
  const o={}; if(!s||s==="-") return o;
  String(s).split("/").forEach(p=>{const i=p.indexOf("="); if(i<0) return; const k=p.slice(0,i).trim(), v=p.slice(i+1).trim(); o[k]=isNaN(+v)?v:+v;});
  return o;
}
function gunStats(cls, ov={}){
  const g={...DATA.guns.find(x=>x.klasse===cls)};
  for(const [k,v] of Object.entries(ov)) g[k]=v;
  if(ov.fReloadSpeed) g.nachladezeit_s = +(2.0/ov.fReloadSpeed).toFixed(2);
  if(ov.fDrawSpeed) g.ziehzeit_s = +(0.6/ov.fDrawSpeed).toFixed(2);
  return g;
}
function derive(g){
  const shotgun = g.maxBuckShot>0;
  const pellets = shotgun ? (g.minBuckShot + g.maxBuckShot-1)/2 : 1;
  const shot = g.fAtkPow*pellets;
  const dps = shot*g.fRateOfFire/60;
  const body = g.klasse==="WERFER" ? 1 : Math.ceil(100/shot);
  const brain = g.klasse==="WERFER" ? 1 : Math.ceil(100/(shot*ZONES.BRAIN.f));
  const spin = g.klasse==="MINIGUN" ? .5 : 0;
  const ttk = (body-1)*60/g.fRateOfFire + spin;
  return {shotgun,pellets,shot,dps,body,brain,ttk,spin};
}
function falloff(g,d){
  const eff=g.fEffectiveRange, r=g.fRange;
  if(d<=eff) return g.fAtkPow;
  if(d>=r) return 0;
  return Math.ceil(g.fAtkPow*(1-(d-eff)/(r-eff)));
}

let uid=0;
function projSVG(cls){
  const m=GUN_META[cls]; const id="p"+(uid++); const cy=20;
  let s=`<svg viewBox="0 0 200 40" role="img" aria-label="Projektil ${esc(cls)}"><defs>
    <linearGradient id="${id}t" x1="0" x2="1"><stop offset="0" stop-color="${m.tr}" stop-opacity="0"/><stop offset="1" stop-color="${m.tr}" stop-opacity=".75"/></linearGradient>
    <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d08a"/><stop offset=".45" stop-color="#c98a3c"/><stop offset="1" stop-color="#6e4318"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e05a48"/><stop offset=".5" stop-color="#b0281d"/><stop offset="1" stop-color="#5c1009"/></linearGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa08a"/><stop offset="1" stop-color="#454a3c"/></linearGradient></defs>`;
  if(m.kind==="bullet"){
    const L=m.len*1.55, W=m.w*1.15, tip=176, base=tip-L, trail=70*m.trLen;
    s+=`<rect x="${base-trail}" y="${cy-W*.32}" width="${trail}" height="${W*.64}" rx="${W*.3}" fill="url(#${id}t)"/>`;
    s+=`<path d="M${base} ${cy-W/2} L${base+L*.55} ${cy-W/2} Q${base+L*.92} ${cy-W/2} ${tip} ${cy} Q${base+L*.92} ${cy+W/2} ${base+L*.55} ${cy+W/2} L${base} ${cy+W/2} Z" fill="url(#${id}b)"/>`;
    s+=`<rect x="${base}" y="${cy-W/2}" width="2" height="${W}" fill="#5a3712"/>`;

function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}
function impactSVG(kind){
  const R=rng(kind.length*97+7); let s=`<svg class="imp" viewBox="0 0 120 80" role="img" aria-label="Einschlag">`;
  const hole=(cx,cy,r,cracks)=>{let o="";for(let i=0;i<cracks;i++){const a=R()*Math.PI*2,l=r*(1.8+R()*2.6);o+=`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*l).toFixed(1)}" y2="${(cy+Math.sin(a)*l).toFixed(1)}" stroke="#c9c2b0" stroke-opacity=".55" stroke-width=".7"/>`;}
    for(let i=0;i<cracks;i++){const a=R()*Math.PI*2,l=r*(2+R()*4);o+=`<circle cx="${(cx+Math.cos(a)*l).toFixed(1)}" cy="${(cy+Math.sin(a)*l).toFixed(1)}" r="${(.5+R()).toFixed(1)}" fill="#a39c8a" opacity=".6"/>`;}
    return o+`<circle cx="${cx}" cy="${cy}" r="${r+1.6}" fill="#4a4740"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#050505"/>`;};
  if(kind==="S") s+=hole(60,40,3,6);
  else if(kind==="M") s+=hole(60,40,4.5,10);
  else if(kind==="L") s+=hole(60,40,6,14);
  else if(kind==="cluster") [[46,28],[66,32],[54,48],[76,50],[40,52],[62,62],[80,24]].forEach(([x,y])=>s+=hole(x,y,2.6,4));
  else if(kind==="boom"){for(let i=0;i<22;i++){const a=R()*Math.PI*2,l=8+R()*28;s+=`<line x1="60" y1="40" x2="${(60+Math.cos(a)*l).toFixed(1)}" y2="${(40+Math.sin(a)*l*.7).toFixed(1)}" stroke="#ffb15c" stroke-opacity="${(.25+R()*.5).toFixed(2)}" stroke-width="1.2"/>`;}
    s+=`<circle cx="60" cy="40" r="14" fill="#ff8a3c" opacity=".35"/><circle cx="60" cy="40" r="8" fill="#ffd28a" opacity=".6"/>`;}
  else s+=hole(56,40,2,5)+`<rect x="58" y="39" width="40" height="2" fill="#8a6a43"/><path d="M90 39 L98 34 L98 46 L90 41 Z" fill="#c23a2e"/>`;
  return s+"</svg>";
}

function profileBars(g,d,maxDps){

/* Simulator */
const HIT = {
  BRAIN:p=>Math.hypot(p.x,p.y-1.66)<=.06, HEAD:p=>Math.hypot(p.x,p.y-1.64)<=.12,
  BODY:p=>Math.abs(p.x)<=.22&&p.y>=.85&&p.y<=1.5, ARM:p=>Math.abs(p.x)>.22&&Math.abs(p.x)<=.34&&p.y>=.8&&p.y<=1.48,
  FOOT:p=>Math.abs(p.x)>=.02&&Math.abs(p.x)<=.2&&p.y>=0&&p.y<.85
};
const zoneAt = p => ["BRAIN","HEAD","BODY","ARM","FOOT"].find(z=>HIT[z](p))||null;
let lastSim=null, simAnim=0;
function simulate(g){
  const p=state.sim, sc=DATA.scopes.find(s=>s.visier===g.standard_visier);
  const useScope = p.aim==="ads" && sc && sc.visier!=="KEINS";
  const A = useScope ? {acc:sc.fZAccuracy,aMin:sc.fZAccurateMin,aMax:sc.fZAccurateMax,iMin:sc.fZInaccurateMin,iMax:sc.fZInaccurateMax,sp:sc.fZAccurateSpread,ce:sc.fZAccurateCenter,mv:sc.fZMoveInaccuracyFactor}
                     : {acc:g.fAccuracy,aMin:g.fAccurateMin,aMax:g.fAccurateMax,iMin:g.fInaccurateMin,iMax:g.fInaccurateMax,sp:g.fAccurateSpread,ce:g.fAccurateCenter,mv:g.fMoveInaccuracyFactor};
  const moving=p.stance==="lauf", crouch=p.stance==="duck";
  const fA=A.aMin*(moving?A.mv:1), fI=A.iMin*(moving?A.mv:1);
  const cA=crouch?(A.aMax+A.aMin)/2:A.aMax, cI=crouch?(A.iMax+A.iMin)/2:A.iMax;
  let acc=fA, inacc=Math.max(fI,fA), pitch=0, yaw=0;
  const dt=60/g.fRateOfFire, aimY=p.target==="kopf"?1.64:1.2, d=p.dist, comp=p.comp/100;
  const n = g.klasse==="WERFER"?1 : Math.min(g.maxMagazine, 30);
  const shots=[]; let total=0, killAt=null; const count={};
  const rad=x=>x*Math.PI/180, sg=()=>Math.random()<.5?-1:1, R=(a,b)=>a+Math.random()*(b-a);
  const base=falloff(g,d);
  for(let i=0;i<n;i++){
    const pel = g.maxBuckShot>0 ? Math.floor(R(g.minBuckShot,g.maxBuckShot)) : 1;
    const hits=[]; let shotDmg=0;
    for(let k=0;k<pel;k++){
      const inner=Math.random()*100<A.acc, hi=Math.max(inacc,acc);
      const r=()=>inner?R(0,acc/2):R(acc/2,hi/2);
      const ax=r()*sg()*90+yaw, ay=r()*sg()*90+pitch;
      const pt={x:d*Math.tan(rad(ax)), y:aimY+d*Math.tan(rad(ay))};
      let zone=zoneAt(pt), dmg=0;
      if(g.klasse==="WERFER"){ const dist=Math.hypot(pt.x,pt.y-1.0), Rr=g.Radius1stWpn; dmg=dist<Rr?Math.floor(g.fAtkPow*(Rr-dist)/Rr):0; zone=dmg>0?(zone||"BODY"):zone; pt.boom=Rr; }
      else if(zone) dmg=Math.floor(base*ZONES[zone].f);
      if(zone) count[zone]=(count[zone]||0)+1;
      shotDmg+=dmg; hits.push({...pt,zone});
    }
    total+=shotDmg; if(killAt===null&&total>=100) killAt=i+1;
    shots.push({hits,aim:{x:d*Math.tan(rad(yaw)),y:aimY+d*Math.tan(rad(pitch))}});
    acc=Math.min(acc+A.sp,cA); inacc=Math.min(inacc+A.sp,cI);
    const kick=g.fRecoilPitch*(p.newRecoil&&i<3?.6:1);
    pitch+=kick*(1-comp); yaw+=g.fRecoilYaw*(p.newRecoil?sg():1)*(1-comp);
    acc=Math.max(acc-A.ce*dt,fA); inacc=Math.max(inacc-A.ce*dt,fI);
    if(p.newRecoil){const f=.5*Math.min(dt/.3,1); pitch-=pitch*f*(1-comp*.5); yaw-=yaw*f*(1-comp*.5);}
  }
  const pellets=shots.reduce((s,x)=>s+x.hits.length,0), hitN=Object.values(count).reduce((a,b)=>a+b,0);
  return {g,shots,total,killAt,count,pellets,hitN,dt,useScope,scopeName:sc?sc.name:"",base,aimY};
}
function runSim(g,instant){
  cancelAnimationFrame(simAnim);
  const s=simulate(g); lastSim=s; showRes(s);
  if(instant||REDUCED){drawSim(s,s.shots.length);return;}
  const step=Math.max(25,Math.min(s.dt*1000,140)); const t0=performance.now();
  const tick=t=>{const k=Math.min(s.shots.length,1+Math.floor((t-t0)/step)); drawSim(s,k); if(k<s.shots.length) simAnim=requestAnimationFrame(tick);};
  simAnim=requestAnimationFrame(tick);
}
function showRes(s){
  const g=s.g, ttk = s.killAt?((s.killAt-1)*s.dt + (g.klasse==="MINIGUN"?.5:0)):null;
  $("#sim-res").innerHTML = `
    <span>Schüsse <b>${s.shots.length}</b>${s.pellets>s.shots.length?` <span class="muted">(${s.pellets} Kugeln)</span>`:""}</span>
    <span>Treffer <b>${s.hitN}</b> <span class="muted">(${s.pellets?Math.round(s.hitN/s.pellets*100):0} %)</span></span>
    ${Object.keys(ZONES).filter(z=>s.count[z]).map(z=>`<span style="color:var(${ZONES[z].c})">${ZONES[z].name} <b>${s.count[z]}</b></span>`).join("")}
    <span>Schaden/Treffer <b>${s.base}</b> <span class="muted">auf ${state.sim.dist} m</span></span>
    <span>Gesamt <b>${fmt(s.total)}</b></span>
    <span>${s.killAt?`Kill nach Schuss <b>${s.killAt}</b> · <b>${Math.round(ttk*1000)} ms</b>`:`<b style="color:var(--bad)">Kein Kill</b>`}</span>
    <span class="muted">${s.useScope?"Mit "+esc(s.scopeName):"Aus der Hüfte"}</span>`;
}
function drawSim(s,k){
  const cv=$("#sim"); if(!cv) return; const box=cv.parentElement, W=box.clientWidth, H=Math.round(clamp(W*.62,260,420));
  const dpr=window.devicePixelRatio||1; cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  const span=3.0, sc=H/span, cy=1.1, X=m=>W/2+m*sc, Y=m=>H/2-(m-cy)*sc;
  const ZC=Object.fromEntries(Object.entries(ZONES).map(([k,z])=>[k,css(z.c)])), MUTED=css("--muted");
  x.fillStyle="#0d0f13"; x.fillRect(0,0,W,H);
  // Brick-Wand im Hintergrund (1 m Blöcke, halbe Versetzung)
  x.strokeStyle="rgba(255,255,255,.04)"; x.lineWidth=1;

  x.strokeStyle="rgba(232,228,218,.25)"; x.strokeRect(X(-.22),Y(1.5),.44*sc,.65*sc); x.beginPath(); x.arc(X(0),Y(1.64),.12*sc,0,7); x.stroke();
  // Rückstoß-Weg
  x.strokeStyle=css("--info"); x.globalAlpha=.6; x.lineWidth=1.5; x.beginPath();

    else {x.strokeStyle=MUTED; x.lineWidth=1; x.beginPath(); x.arc(px,py,3,0,7); x.stroke();}

}
function drawFalloff(g){
  const el=$("#falloff"); if(!el) return; const Wd=520,Hd=220,L=44,Rr=14,T=14,B=34, iw=Wd-L-Rr, ih=Hd-T-B;
  const pel=g.maxBuckShot>0?(g.minBuckShot+g.maxBuckShot-1)/2:1;
  const maxX=Math.min(g.fRange,400), maxY=Math.max(120,Math.ceil(g.fAtkPow*pel*2.2/50)*50);
  const sx=v=>L+v/maxX*iw, sy=v=>T+ih-v/maxY*ih;
  const pts=f=>{let a=[];for(let i=0;i<=60;i++){const dd=maxX*i/60;a.push(`${sx(dd).toFixed(1)},${sy(falloff(g,dd)*pel*f).toFixed(1)}`);}return a.join(" ");};
  const ticksX=[0,.25,.5,.75,1].map(t=>Math.round(maxX*t)), ticksY=[]; for(let v=0;v<=maxY;v+=maxY>200?100:50) ticksY.push(v);
  const dist=Math.min(state.sim.dist,maxX);
  el.innerHTML=`<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" role="img" aria-label="Schaden über Distanz">
    ${ticksY.map(v=>`<line x1="${L}" x2="${Wd-Rr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    ${ticksX.map(v=>`<text x="${sx(v)}" y="${Hd-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${v} m</text>`).join("")}
    <line x1="${L}" x2="${Wd-Rr}" y1="${sy(100)}" y2="${sy(100)}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${Wd-Rr}" y="${sy(100)-5}" text-anchor="end" font-size="10" fill="var(--bad)">100 HP = ein Treffer tötet</text>
    <line x1="${sx(Math.min(g.fEffectiveRange,maxX))}" x2="${sx(Math.min(g.fEffectiveRange,maxX))}" y1="${T}" y2="${T+ih}" stroke="var(--line-2)" stroke-dasharray="2 3"/>
    <polyline points="${pts(ZONES.BRAIN.f)}" fill="none" stroke="var(--z-brain)" stroke-width="2"/>
    <polyline points="${pts(1)}" fill="none" stroke="var(--z-body)" stroke-width="2.5"/>
    <line x1="${sx(dist)}" x2="${sx(dist)}" y1="${T}" y2="${T+ih}" stroke="var(--info)"/><circle cx="${sx(dist)}" cy="${sy(falloff(g,dist)*pel)}" r="4" fill="var(--info)"/>
    <text x="${L+6}" y="${T+12}" font-size="11" fill="var(--z-body)">Körper</text><text x="${L+60}" y="${T+12}" font-size="11" fill="var(--z-brain)">Kern ×2.2</text>
    <text x="${sx(Math.min(g.fEffectiveRange,maxX))+4}" y="${T+ih-6}" font-size="10" fill="var(--muted)">effektiv</text>
  </svg>`;
}
function timeline(rows){
  return `<div class="tl">${rows.map((r,i)=>`<div class="tl-row ${r.ev.length?"has-ev":""}"><span class="mono">${esc(r.label)}</span>
    <div class="tl-track" data-dur="${r.dur}">${r.segs.map(s=>`<div class="tl-seg ${s.cls||""}" style="left:${s.a}%;width:${s.b-s.a}%">${esc(s.t)}</div>`).join("")}
      ${r.ev.map(([p,l])=>`<div class="tl-ev" style="left:${p}%"><span>${esc(l)}</span></div>`).join("")}<div class="tl-head"></div></div>
    <span class="mono">${fmt(r.dur,2)} s</span></div>`).join("")}
    <div><button class="btn ghost" data-play>▶ Abspielen</button></div></div>`;
}
function bindTimeline(){
  $$("[data-play]").forEach(b=>b.onclick=()=>{
    const tracks=$$(".tl-track",b.closest(".tl"));
    tracks.forEach(t=>{const hd=$(".tl-head",t),dur=+t.dataset.dur*1000; if(REDUCED){return;} const t0=performance.now();
      const f=n=>{const p=Math.min(1,(n-t0)/dur); hd.style.opacity=p<1?1:0; hd.style.left=(p*100)+"%"; if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f);});
  });

function arcSVG(m,small){
  const W=small?96:300,H=small?22:190, px=W/2, py=H-(small?2:14), sc=(H-(small?4:30))/2.4;
  const wedge=(r,a,attrs)=>{const h=a/2*Math.PI/180, R=r*sc; const x1=px+Math.sin(-h)*R,y1=py-Math.cos(h)*R,x2=px+Math.sin(h)*R; return `<path d="M${px} ${py} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R.toFixed(1)} ${R.toFixed(1)} 0 0 1 ${x2.toFixed(1)} ${y1.toFixed(1)} Z" ${attrs}/>`;};
  if(small) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${wedge(m.reichweite_m,m.winkel_grad,'fill="var(--brass)" fill-opacity=".35" stroke="var(--brass)" stroke-width="1"')}</svg>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Schlagbereich">
    ${[1,2].map(r=>`<circle cx="${px}" cy="${py}" r="${r*sc}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${px+r*sc+3}" y="${py-2}" font-size="10" fill="var(--muted)">${r} m</text>`).join("")}
    ${wedge(2.2,110,'fill="none" stroke="var(--line-2)"')}
    ${wedge(m.reichweite_m,m.winkel_grad,'fill="var(--brass)" fill-opacity=".22" stroke="var(--brass)" stroke-width="1.5"')}
    <circle cx="${px}" cy="${py}" r="6" fill="var(--fg)"/><line x1="${px}" y1="${py}" x2="${px}" y2="${py-16}" stroke="var(--fg)" stroke-width="2"/>
    <text x="${px}" y="14" text-anchor="middle" font-size="11" fill="var(--brass)">${m.reichweite_m} m · ${m.winkel_grad}°</text></svg>`;
}

function drawScope(s){
  const cv=$("#scope"); if(!cv) return; const W=cv.parentElement.clientWidth, H=Math.round(clamp(W*.56,220,420)), dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px"; const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  const raw=$("#sc-cmp")&&$("#sc-cmp").checked;
  const fov = raw?60:(s.midstep>0&&scopeStage===0?s.midfovs:s.fZFov);
  const visH=2*scopeDist*Math.tan(fov/2*Math.PI/180), ppm=H/visH, eye=1.6, horizon=H/2;
  const Y=m=>H/2-(m-eye)*ppm, X=m=>W/2+m*ppm;
  const sky=x.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#2b3442"); sky.addColorStop(1,"#4a5160"); x.fillStyle=sky; x.fillRect(0,0,W,H);
  x.fillStyle="#3b3528"; x.fillRect(0,Y(0),W,H-Y(0));
  // Brick-Wand 1 m Blöcke, 4 m hoch hinter dem Ziel
  for(let r=0;r<4;r++){const off=(r%2)*.5; for(let c=-60;c<60;c++){const bx=X(c+off), by=Y(r+1); if(bx>W||bx+ppm<0) continue; x.fillStyle=(c+r)%3? "#7b3b2c":"#8a4532"; x.fillRect(bx,by,ppm,ppm); x.strokeStyle="rgba(0,0,0,.35)"; x.lineWidth=Math.max(.5,ppm*.04); x.strokeRect(bx,by,ppm,ppm);}}
  // Figur
  x.fillStyle="#1b1e24"; x.fillRect(X(-.2),Y(.85),.4*ppm,.85*ppm); x.fillRect(X(-.22),Y(1.5),.44*ppm,.65*ppm); x.fillRect(X(-.34),Y(1.48),.12*ppm,.68*ppm); x.fillRect(X(.22),Y(1.48),.12*ppm,.68*ppm);
  x.beginPath(); x.arc(X(0),Y(1.64),.12*ppm,0,7); x.fill(); x.fillStyle="#d6a54e"; x.fillRect(X(-.22),Y(1.5),.44*ppm,Math.max(1,.06*ppm));
  // Overlay
  const k=raw?"none":SCOPE_KIND[s.visier], cx=W/2, cy=H/2, r=Math.min(W,H)*.44;
  x.lineWidth=1.5;
  if(k==="none"){x.strokeStyle="#fff1c9";x.beginPath();[[-14,-5],[5,14]].forEach(([a,b])=>{x.moveTo(cx+a,cy);x.lineTo(cx+b,cy);x.moveTo(cx,cy+a);x.lineTo(cx,cy+b);});x.stroke();}
  if(k==="iron"){x.fillStyle="#111";x.fillRect(cx-3,cy,6,H);x.fillRect(cx-40,cy+14,26,H);x.fillRect(cx+14,cy+14,26,H);}
  if(k==="reddot"||k==="holo"){x.strokeStyle="#222";x.lineWidth=10;x.strokeRect(cx-r*.9,cy-r*.65,r*1.8,r*1.3);x.fillStyle="#ff3b2f";x.shadowColor="#ff3b2f";x.shadowBlur=8;x.beginPath();x.arc(cx,cy,2.5,0,7);x.fill();
    if(k==="holo"){x.strokeStyle="#ff3b2f";x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,26,0,7);x.stroke();} x.shadowBlur=0;}
  if(k==="ring"||k==="cross"){x.fillStyle="#050608";x.beginPath();x.rect(0,0,W,H);x.moveTo(cx+r,cy);x.arc(cx,cy,r,0,Math.PI*2,true);x.closePath();x.fill("evenodd");x.strokeStyle="#000";x.lineWidth=3;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();
    x.strokeStyle="#0b0b0b";x.lineWidth=k==="cross"?1.2:2;x.beginPath();x.moveTo(cx-r,cy);x.lineTo(cx-8,cy);x.moveTo(cx+8,cy);x.lineTo(cx+r,cy);x.moveTo(cx,cy+8);x.lineTo(cx,cy+r);if(k==="cross"){x.moveTo(cx,cy-r);x.lineTo(cx,cy-8);}x.stroke();
    if(k==="ring"){x.fillStyle="#e2584b";x.beginPath();x.moveTo(cx,cy-2);x.lineTo(cx-6,cy+9);x.lineTo(cx+6,cy+9);x.fill();}
    else{x.fillStyle="#0b0b0b";for(let i=1;i<=4;i++){[[i,0],[-i,0],[0,i]].forEach(([a,b])=>{x.beginPath();x.arc(cx+a*r*.18,cy+b*r*.18,2.2,0,7);x.fill();});}}}
  x.fillStyle="#e8e4da"; x.font="11px "+css("--f-mono"); x.fillText(`${scopeDist} m · FOV ${fmt(fov,1)}° · Figur ${fmt(1.8*ppm,0)} px hoch`,12,H-12);
}

function potionSVG(c){

function toast(m){demo.toast=m;demo.toastT=performance.now();}
function damage(v){ if(demo.dead) return; let left=v; if(demo.shield>0){const a=Math.min(demo.shield,left);demo.shield-=a;left-=a;} demo.hp=Math.max(0,demo.hp-left); demo.lastHit=performance.now(); if(demo.hp===0){demo.dead=true;demo.deadAt=performance.now();toast("Tot. Sofort-Respawn ist ab 2 s nach dem Tod möglich.");} }
function use(id){

function tickDemo(dt,t){

    const rows=DATA.list.filter(r=>(!state.listCls||r.klasse===state.listCls)&&(!state.listZu||r.zuordnung===state.listZu)&&(!q||[r.by_name,r.anzeigename,r.klasse,classLabel(r.klasse),r.munition,r.besonderheit].join(" ").toLowerCase().includes(q)));
    $("#lcount").textContent=`${rows.length} von ${DATA.list.length}`;
    $("#lbody").innerHTML=rows.map(r=>`<tr data-pick="${esc(r.by_name)}"><td class="mono" style="font-size:12px">${esc(r.by_name.length>40?r.by_name.slice(0,40)+"…":r.by_name)}</td><td>${esc(r.anzeigename)}</td><td>${esc(classLabel(r.klasse))}</td><td class="muted">${esc(r.munition)}</td><td class="muted">${esc(r.visier)}</td><td class="wrap-cell mono" style="font-size:12px">${esc(r.abweichungen)}</td><td class="wrap-cell">${esc(r.besonderheit)}</td><td><span class="chip ${r.zuordnung==="fest"?"":"prop"}">${r.zuordnung==="fest"?"real":"Vorschlag"}</span></td></tr>`).join("")||`<tr><td colspan="8" class="muted">Keine Treffer. Suchbegriff oder Filter ändern.</td></tr>`;
    $$("#lbody [data-pick]").forEach(tr=>tr.onclick=()=>pick(tr.dataset.pick));
  };
  $("#lq").oninput=e=>{state.listQ=e.target.value;fill();}; $("#lc").onchange=e=>{state.listCls=e.target.value;fill();}; $("#lz").onchange=e=>{state.listZu=e.target.value;fill();};
  fill();
}
function pick(by){
  const r=DATA.list.find(x=>x.by_name===by); if(!r) return;
  if(gunClasses.includes(r.klasse)){state.gun=r.klasse;state.gunOv=r;go("schusswaffen");}
  else if(meleeClasses.includes(r.klasse)){state.melee=r.klasse;state.meleeOv=r;go("nahkampf");}
  else if(throwClasses.includes(r.klasse)){state.thr=r.klasse;state.thrOv=r;go("granaten");}
}
